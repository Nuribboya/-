name: 매출 목표 페이스 — 윈도우 설치 파일 빌드

on:
  workflow_dispatch:
  push:
    paths:
      - 'sales_report/**'
      - '.github/workflows/build-desktop.yml'

jobs:
  windows:
    # electron-builder 의 윈도우 타깃은 윈도우 러너에서만 서명·패키징이 끝까지 돌아갑니다.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sales_report/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sales_report/desktop/package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: 매출목표페이스-설치파일
          path: sales_report/desktop/dist/*.exe
          if-no-files-found: error
