name: Musinsa raffle probe (temporary)

on:
  push:
    paths:
      - ".github/workflows/musinsa-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find raffle list endpoint and recent raffle ids
        shell: python
        run: |
          import json, re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                "Accept-Language": "ko-KR,ko;q=0.9"}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, ""
              except Exception as e:
                  return str(e), ""
          st, html = get("https://www.musinsa.com/events/raffle")
          chunks = re.findall(r'src="(https://static\.msscdn\.net/[^"]+\.js)"', html)
          print("chunks", len(chunks))
          seen = set()
          for c in chunks:
              s, js = get(c)
              for m in re.finditer(r'["`]((?:https?:)?//[a-z0-9.-]+\.(?:musinsa\.com|msscdn\.net)[^"`]{0,60}|/api2?/[^"`]{0,80}raffle[^"`]{0,60})["`]', js):
                  u = m.group(1)
                  if u not in seen:
                      seen.add(u); print("url:", c.rsplit("/",1)[-1][:40], u)
              for m in re.finditer(r'raffle[A-Za-z]*\W{0,5}', js):
                  pass
              for m in list(re.finditer(r'.{0,120}api2/raffle.{0,160}', js))[:6]:
                  print("ctx:", m.group(0))
          def detail(i):
              s, h = get(f"https://www.musinsa.com/events/raffle/{i}")
              m = re.search(r'"raffleData":(\{.*?\}),"isGoodsPdpLinkEnabled"', h)
              if not m:
                  return s, None
              try:
                  d = json.loads(m.group(1))
              except Exception:
                  return s, "parse-fail"
              return s, (d.get("title"), d.get("entryStartTime"), d.get("raffleStateMessage"), d.get("price"), d.get("entryCount"), d.get("winnerCount"), d.get("brandName"))
          for i in [300, 500, 800, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 7000, 10000, 20000]:
              print("id", i, detail(i))
