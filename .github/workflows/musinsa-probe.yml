name: Musinsa raffle probe (temporary)

on:
  push:
    paths:
      - ".github/workflows/musinsa-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List recent raffles
        shell: python
        run: |
          import json, re, urllib.request, urllib.error
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                "Accept-Language": "ko-KR,ko;q=0.9", "Accept": "application/json, text/html"}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:300]
              except Exception as e:
                  return str(e), ""
          for u in ["https://api.musinsa.com/api2/campaign/raffle/raffles",
                    "https://api.musinsa.com/api2/campaign/raffle/raffles?page=1&size=20",
                    "https://api.musinsa.com/api2/campaign/raffle/v1/raffles",
                    "https://api.musinsa.com/api2/campaign/raffle/raffles/1000",
                    "https://api.musinsa.com/api2/campaign/v1/raffles"]:
              s, b = get(u); print("API", s, u, "|", b[:400].replace("\n", " "))
          def detail(i):
              s, h = get(f"https://www.musinsa.com/events/raffle/{i}")
              m = re.search(r'"raffleData":(\{.*?\}),"isGoodsPdpLinkEnabled"', h)
              if not m: return None
              try: return json.loads(m.group(1))
              except Exception: return None
          lo, hi = 1000, 1500
          while hi - lo > 1:
              mid = (lo + hi) // 2
              if detail(mid): lo = mid
              else:
                  # allow small gaps
                  if any(detail(mid + k) for k in (1, 2, 3)): lo = mid
                  else: hi = mid
          print("max id ~", lo)
          for i in range(lo, max(lo - 40, 1000), -1):
              d = detail(i)
              if not d: print(i, "-"); continue
              print(i, "|", d.get("title"), "|", d.get("brandName"), "|", d.get("normalPrice"), "->", d.get("price"),
                    "|", d.get("entryStartTime"), "~", d.get("entryEndTime"), "|", d.get("raffleStateMessage"),
                    "| entries", d.get("entryCount"), "winners", d.get("winnerCount"))
