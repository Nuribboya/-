name: Musinsa raffle probe (temporary)

on:
  push:
    paths:
      - ".github/workflows/musinsa-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect raffle page structure
        shell: python
        run: |
          import json, re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                "Accept-Language": "ko-KR,ko;q=0.9"}
          for url in ["https://www.musinsa.com/events/raffle", "https://www.musinsa.com/events/raffle/261"]:
              print("=" * 20, url)
              try:
                  req = urllib.request.Request(url, headers=UA)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      html = r.read().decode("utf-8", "replace")
                      print("status", r.status, "len", len(html))
              except Exception as e:
                  print("ERROR", e); continue
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
              print("next_data:", bool(m))
              if m:
                  data = json.loads(m.group(1))
                  def walk(o, path="", depth=0):
                      if depth > 7: return
                      if isinstance(o, dict):
                          for k, v in list(o.items())[:40]:
                              t = type(v).__name__
                              s = json.dumps(v, ensure_ascii=False)[:120] if not isinstance(v, (dict, list)) else ""
                              print(f"{path}/{k} [{t}] {s}")
                              walk(v, f"{path}/{k}", depth + 1)
                      elif isinstance(o, list) and o:
                          print(f"{path}[] len={len(o)}")
                          walk(o[0], f"{path}[0]", depth + 1)
                  walk(data.get("props", {}))
              apis = sorted(set(re.findall(r'https?://[a-z0-9.-]*musinsa[a-z0-9.-]*/[^"\'\s<>]{0,80}', html)))
              print("musinsa urls:", len(apis))
              for a in apis[:60]: print("  ", a)
              for kw in ["raffle", "응모", "draw"]:
                  for mm in list(re.finditer(kw, html))[:5]:
                      print(f"ctx[{kw}]:", html[max(0, mm.start()-150): mm.end()+150].replace("\n", " "))
