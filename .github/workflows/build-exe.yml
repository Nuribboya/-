name: build-exe

# 윈도우 실행 파일은 윈도우에서만 만들 수 있어 GitHub 의 윈도우 러너에서 만든다.
#
#   베타 (기본)  코드를 올릴 때마다 만들어 'finder-beta' 한 곳에 덮어쓴다.
#                받는 주소가 늘 같다. 써 보면서 계속 고치는 동안은 이것만 쓴다.
#   정식         Actions 탭에서 수동 실행하고 버전(예: 1.0.0)을 넣을 때만.
#                prime_contractor/__init__.py 의 CHANNEL 이 "stable" 이어야 한다.
on:
  push:
    branches: ['**']
    paths:
      - 'prime_contractor/**'
      - 'prime_finder.spec'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '정식 버전 (예: 1.0.0). 비워 두면 베타로 다시 만듭니다.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # 베타를 연달아 올리면 나중 것만 남기면 된다. 앞선 빌드는 취소.
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      # 윈도우 러너의 콘솔은 cp1252 라 한글을 찍으면 죽는다(베타 첫 빌드가 이걸로 실패).
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller pytest ttkbootstrap

      - name: 테스트
        run: python -m pytest tests/test_prime_contractor.py -q

      - name: 무엇을 낼지 정하기
        id: ver
        shell: bash
        run: |
          channel=$(python -c "import prime_contractor as p; print(p.CHANNEL)")
          code=$(python -c "import prime_contractor as p; print(p.__version__)")
          want="${{ inputs.version }}"; want="${want#v}"
          if [ -n "$want" ]; then
            if [ "$channel" != "stable" ]; then
              echo "::error::정식 버전을 내려면 prime_contractor/__init__.py 의 CHANNEL 을 \"stable\" 로 바꿔 주세요. 지금은 $channel 입니다."
              exit 1
            fi
            if [ "$code" != "$want" ]; then
              echo "::error::__version__($code) 과 요청한 버전($want) 이 다릅니다."
              exit 1
            fi
            echo "kind=stable" >> "$GITHUB_OUTPUT"
            echo "tag=finder-v$want" >> "$GITHUB_OUTPUT"
          else
            echo "kind=beta" >> "$GITHUB_OUTPUT"
            echo "tag=finder-beta" >> "$GITHUB_OUTPUT"
          fi

      - name: 빌드 정보 새기기
        # 베타는 번호가 없어 '언제, 어느 코드로 만든 건지'를 앱 제목줄에 보인다.
        shell: bash
        run: |
          stamp=$(TZ=Asia/Seoul date +'%m-%d %H:%M')
          echo "BUILD = \"${stamp} ${GITHUB_SHA::7}\"" > prime_contractor/_build.py
          cat prime_contractor/_build.py

      - name: exe 빌드
        run: python -m PyInstaller --noconfirm --clean prime_finder.spec

      - name: 실행 확인
        # 화면을 눈으로 볼 순 없지만, 위젯을 실제로 다 만들어 보면 이번 같은
        # "-bootstyle" 생성 단계 오류(임포트만 해서는 안 걸림)는 여기서 잡힌다.
        shell: bash
        run: |
          python - <<'PY'
          from prime_contractor.gui import App, _make_root
          from prime_contractor.build_info import label
          root = _make_root()
          App(root)
          root.update()
          root.destroy()
          print("화면 생성 확인:", label())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: PrimeFinder-windows
          path: dist/PrimeFinder.exe
          retention-days: 14

      - name: 올리기
        # 파일이 붙었는지는 '실제로 받아지나'로 확인한다. 릴리스의 파일 목록(API)은
        # 늦게 갱신되거나 비어 보일 때가 있어 목록만 믿으면 오판한다.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          KIND: ${{ steps.ver.outputs.kind }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/PrimeFinder.exe"
          downloadable() {
            for wait in 0 5 10 20; do
              sleep "$wait"
              got=$(curl -sL -r 0-1048575 -o /dev/null -w '%{size_download}' "$url" || echo 0)
              [ "${got:-0}" -ge 1000000 ] && return 0
            done
            return 1
          }

          if [ "$KIND" = "beta" ]; then
            # 베타는 늘 최신 한 벌만 둔다. 지우고 이 커밋으로 새로 만든다.
            gh release delete "$TAG" --yes --cleanup-tag > /dev/null 2>&1 || true
            sleep 3
            gh release create "$TAG" dist/PrimeFinder.exe \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "원청 찾기 — 베타 (계속 바뀝니다)" \
              --notes "시험용 베타입니다. 코드를 고칠 때마다 이 자리에 새로 덮어씁니다. 앱 제목줄의 날짜·코드로 어느 빌드인지 확인하세요. (${GITHUB_SHA::7})"
          else
            if ! gh release view "$TAG" > /dev/null 2>&1; then
              gh release create "$TAG" --target "$GITHUB_SHA" \
                --title "원청 찾기 $TAG" \
                --notes "받아서 쓰시던 PrimeFinder.exe 에 덮어쓰면 됩니다. 파이썬 설치는 필요 없습니다."
            fi
            gh release upload "$TAG" dist/PrimeFinder.exe --clobber \
              || echo "업로드가 거절됐습니다. 이미 올라가 있는지 확인합니다."
          fi

          if ! downloadable; then
            echo "::error::$TAG 의 PrimeFinder.exe 를 받을 수 없습니다: $url"
            exit 1
          fi
          echo "받는 곳: $url"
