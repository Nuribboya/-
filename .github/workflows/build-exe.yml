name: build-exe

# 윈도우 실행 파일은 윈도우에서만 만들 수 있다. 빌드 환경을 따로 갖추는 대신
# GitHub 의 윈도우 러너에서 만들어 내려받게 한다.
on:
  push:
    branches: ['**']
    paths:
      - 'prime_contractor/**'
      - 'prime_finder.spec'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:        # Actions 탭에서 수동 실행

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller pytest

      - name: 테스트
        run: python -m pytest tests/test_prime_contractor.py -q

      - name: exe 빌드
        run: python -m PyInstaller --noconfirm --clean prime_finder.spec

      - name: 실행 확인
        # GUI 는 CI 에서 띄울 수 없으니, 묶인 코드가 임포트되는지까지만 본다.
        run: python -c "import prime_contractor.gui; print('import ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: PrimeFinder-windows
          path: dist/PrimeFinder.exe
          retention-days: 30
