name: build-exe

# 윈도우 실행 파일은 윈도우에서만 만들 수 있다. 빌드 환경을 따로 갖추는 대신
# GitHub 의 윈도우 러너에서 만든다.
#   - 브랜치에 push   → 아티팩트로 올린다 (30일 보관, 확인용)
#   - finder-v* 태그  → Release 를 만들어 exe 를 첨부한다 (만료 없음)
#     이 저장소에는 앱이 여럿이라 태그에 앱 이름을 붙여 서로 섞이지 않게 한다.
#   - 수동 실행 + 버전 → 태그까지 여기서 만든다. 태그를 직접 밀 수 없는
#                        환경에서도 배포할 수 있고, Actions 탭에서 버튼으로 낸다.
on:
  push:
    branches: ['**']
    tags: ['finder-v*']
    paths:
      - 'prime_contractor/**'
      - 'prime_finder.spec'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '배포할 버전 (예: 1.0.0). 비워 두면 빌드만 하고 Release 는 안 만듭니다.'
        required: false
        default: ''

permissions:
  contents: write          # Release 를 만들려면 필요하다

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller pytest

      - name: 테스트
        run: python -m pytest tests/test_prime_contractor.py -q

      - name: 배포 버전 결정
        # 배포 번호와 코드의 __version__ 이 어긋나면 앱이 자기가 구버전인 줄
        # 알고 업데이트 알림을 계속 띄운다. 어긋나면 여기서 멈춘다.
        id: ver
        shell: bash
        run: |
          code=$(python -c "import prime_contractor; print(prime_contractor.__version__)")
          want=""
          if [[ "$GITHUB_REF" == refs/tags/finder-v* ]]; then
            want="${GITHUB_REF_NAME#finder-v}"
          elif [ -n "${{ inputs.version }}" ]; then
            want="${{ inputs.version }}"
            want="${want#v}"
          fi
          echo "코드 $code / 배포 요청 ${want:-(없음)}"
          if [ -n "$want" ] && [ "$code" != "$want" ]; then
            echo "::error::__version__($code) 과 배포 버전($want) 이 다릅니다. \
            prime_contractor/__init__.py 를 먼저 맞춰 주세요."
            exit 1
          fi
          echo "release=$want" >> "$GITHUB_OUTPUT"

      - name: exe 빌드
        run: python -m PyInstaller --noconfirm --clean prime_finder.spec

      - name: 실행 확인
        # GUI 는 CI 에서 띄울 수 없으니, 묶인 코드가 임포트되는지까지만 본다.
        run: python -c "import prime_contractor.gui; print('import ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: PrimeFinder-windows
          path: dist/PrimeFinder.exe
          retention-days: 30

      - name: Release 만들기
        # 릴리스를 먼저 만들고(파일 없이), 파일은 따로 올린 뒤 실제로 붙었는지
        # 확인한다. 한 번에 만들면서 올리는 방식은 파일이 조용히 빠진 채 '성공'
        # 으로 끝난 적이 있다(v1.3.0·v1.4.0). 파일 없는 릴리스는 받는 사람에게
        # 빈 페이지일 뿐이라, 확인이 안 되면 여기서 빌드를 실패시킨다.
        if: steps.ver.outputs.release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: finder-v${{ steps.ver.outputs.release }}
        run: |
          exe_size() {
            gh release view "$TAG" --json assets \
              --jq '.assets[] | select(.name=="PrimeFinder.exe") | .size' 2>/dev/null || true
          }

          # 업로드가 중간에 깨지면 목록에는 안 보이는 반쪽짜리 파일 기록이 남아
          # 이름을 차지한다. 그러면 다시 올려도 'already exists' 로 거절된다
          # (v1.3.0·v1.4.0). 파일 없는 릴리스는 지우고 새로 만든다.
          if gh release view "$TAG" > /dev/null 2>&1 && [ -z "$(exe_size)" ]; then
            echo "$TAG 에 파일이 없어 릴리스를 지우고 다시 만듭니다."
            gh release delete "$TAG" --yes --cleanup-tag
            sleep 5
          fi

          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "원청 찾기 $TAG" \
              --notes "받아서 쓰시던 PrimeFinder.exe 에 덮어쓰면 됩니다. 파이썬 설치는 필요 없습니다."
          fi

          for attempt in 1 2 3; do
            gh release upload "$TAG" dist/PrimeFinder.exe --clobber && break
            echo "업로드 재시도 $attempt..."; sleep $((attempt * 5))
          done

          size=$(exe_size)
          if [ -z "$size" ] || [ "$size" -lt 1000000 ]; then
            echo "::error::$TAG 에 PrimeFinder.exe 가 붙지 않았습니다 (크기: ${size:-없음})."
            exit 1
          fi
          echo "확인: PrimeFinder.exe ${size} bytes 첨부됨"
          echo "받는 곳: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
