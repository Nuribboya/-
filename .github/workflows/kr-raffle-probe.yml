name: KR raffle aggregator probe (temporary)

on:
  push:
    paths:
      - ".github/workflows/kr-raffle-probe.yml"
      - "resell_radar/sources/luckd.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the luck-d source against live pages
        shell: python
        run: |
          import sys, tempfile
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0, ".")
          from resell_radar.sources import luckd
          from resell_radar.storage import Store
          from resell_radar.tiers import DEFAULT_TIERS
          from resell_radar.venues import apply_grades
          for cat in (1, 2):
              h = luckd._get(luckd.LIST_URL.format(category=cat, page=1), 30)
              print("category", cat, "first ids", luckd.parse_list(h)[:5])
          store = Store(Path(tempfile.mkdtemp()) / "db.sqlite")
          rs = luckd.fetch(store, pause=0.3)
          unreadable = store.conn.execute("SELECT count(*) FROM luckd_cache WHERE data LIKE '%unreadable%'").fetchone()[0]
          print("releases", len(rs), "unreadable", unreadable)
          print("dates", Counter(r.release_at.date().isoformat() for r in rs).most_common())
          print("methods", Counter(r.method for r in rs))
          print("venue counts", Counter(r.retailer_count for r in rs))
          apply_grades(rs, DEFAULT_TIERS, {})
          print("venue names", Counter(v.name + ":" + v.grade for r in rs for v in r.venues).most_common(30))
          for r in rs[:25]:
              print(" -", r.release_at.date(), r.method, r.retailer_count, r.retail_price, "|", r.name[:55], "|", r.url[:70])
