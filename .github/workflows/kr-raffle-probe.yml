name: KR raffle aggregator probe (temporary)

on:
  push:
    paths:
      - ".github/workflows/kr-raffle-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect luck-d and shoeprize
        shell: python
        run: |
          import json, re, urllib.request, urllib.error
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                "Accept-Language": "ko-KR,ko;q=0.9"}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, ""
              except Exception as e:
                  return str(e), ""
          for url in ["https://www.luck-d.com/robots.txt", "https://www.shoeprize.com/robots.txt"]:
              s, b = get(url); print("ROBOTS", url, s); print(b[:800])
          for url in ["https://www.luck-d.com/release/", "https://www.shoeprize.com/today"]:
              s, h = get(url)
              print("=" * 10, url, s, len(h))
              print("next_data:", "__NEXT_DATA__" in h, "| nuxt:", "__NUXT__" in h)
              links = re.findall(r'href="(/[^"]{3,80})"', h)
              from collections import Counter
              pref = Counter("/".join(l.split("/")[:3]) for l in links)
              print("link prefixes:", pref.most_common(15))
              prods = [l for l in links if re.search(r"/release/\d|/product/|/drops/|/release/[a-z0-9-]+/?$", l)]
              print("product-ish links:", prods[:15])
              txt = re.sub(r"<script.*?</script>|<style.*?</style>", " ", h, flags=re.S)
              txt = re.sub(r"<[^>]+>", " ", txt); txt = re.sub(r"\s+", " ", txt)
              print("TEXT:", txt[:2500])
              if prods:
                  u = url.split("/")[0] + "//" + url.split("/")[2] + prods[0]
                  s2, h2 = get(u)
                  t2 = re.sub(r"<script.*?</script>|<style.*?</style>", " ", h2, flags=re.S)
                  t2 = re.sub(r"<[^>]+>", " ", t2); t2 = re.sub(r"\s+", " ", t2)
                  print("--- DETAIL", u, s2, len(h2)); print(t2[:3000])
                  for m in list(re.finditer(r'<a[^>]+href="(https?://[^"]+)"[^>]*>', h2))[:40]:
                      print("  out:", m.group(1)[:120])
