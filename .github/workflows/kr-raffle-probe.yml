name: KR raffle aggregator probe (temporary)

on:
  push:
    paths:
      - ".github/workflows/kr-raffle-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Venue rows on luck-d product pages
        shell: python
        run: |
          import re, html as H, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                "Accept-Language": "ko-KR,ko;q=0.9"}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                  return r.read().decode("utf-8", "replace")
          sq = lambda s: re.sub(r"\s+", " ", s)
          ids, raffle_ids = [], []
          for page in range(1, 6):
              h = get(f"https://www.luck-d.com/release/?page={page}")
              pids = list(dict.fromkeys(re.findall(r'href="/products/(\d+)"', h)))
              dates = re.findall(r'(\d{1,2}월 \d{1,2}일|\d{2}\.\d{2}|D-\d+|오늘|마감)', sq(re.sub(r"<[^>]+>", " ", h)))
              print("page", page, len(pids), pids[:4], "...", "| date tokens:", dates[:12])
              ids += pids
          for pid in ids:
              p = get(f"https://www.luck-d.com/products/{pid}")
              d = re.search(r'class="product_info_content">([^<]*발매 정보입니다[^<]*)<', p)
              d = H.unescape(d.group(1)) if d else ""
              if "응모" in d or "드로우" in d or "래플" in d:
                  raffle_ids.append(pid)
              if len(raffle_ids) >= 2: break
          print("raffle products:", raffle_ids)
          for pid in raffle_ids[:2] + ids[:1]:
              p = get(f"https://www.luck-d.com/products/{pid}")
              d = re.search(r'class="product_info_content">([^<]*발매 정보입니다[^<]*)<', p)
              print("=" * 8, pid, "|", H.unescape(d.group(1)) if d else "-")
              plats = re.findall(r'data-platform="([^"]+)"', p)
              print("data-platform:", plats)
              body = re.sub(r"<script.*?</script>|<style.*?</style>|<svg.*?</svg>|<img[^>]*>", "", p[p.find("<body"):], flags=re.S)
              k = body.find("release_list") if "release_list" in body else body.find(plats[-1] if plats else "응모")
              print("ROWS HTML:", sq(body[max(0, k-200): k+3500])[:3600])
