function buildItems() {
  const ty = [], fc = [], ins = [];
  for (let i = 0; i < 8; i++) for (let t = 1; t <= 9; t++) ty.push({ id: `t${t}-${i}`, kind: "type", t, text: ITEMS_BY_TYPE[t][i] });
  FC.forEach(([a, b, ta, tb], i) => fc.push({ id: `fc${i}`, kind: "fc", a, b, ta, tb }));
  for (let i = 0; i < 4; i++) for (const k of ["sp", "so", "sx"]) ins.push({ id: `${k}${i}`, kind: "inst", k, text: INST_ITEMS[k][i] });
  // 유형 6 : 양자택일 1 : 본능 1 비율로 섞음
  const pattern = [ty, ty, ty, fc, ty, ty, ty, ins];
  const out = [];
  while (ty.length || fc.length || ins.length) for (const src of pattern) if (src.length) out.push(src.shift());
  return out;
}
const ITEMS = buildItems();
const BY_ID = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const PER_PAGE = 10;
const PAGES = Math.ceil(ITEMS.length / PER_PAGE);
const FC_LEAN = { 1: 2, 2: 1, 3: -1, 4: -2 };

// ---------- 상태 ----------
const KEY = "enneagram-deep-v1";
let state = { answers: {}, page: 0, view: "intro", mbti: "" };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.answers) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const app = document.getElementById("app");
const isDone = id => state.answers[id] != null;
const doneCount = () => ITEMS.filter(i => isDone(i.id)).length;
function go(view, page) { state.view = view; if (page != null) state.page = page; save(); render(); scrollTo(0, 0); }

function render() {
  if (state.view === "quiz") return renderQuiz();
  if (state.view === "result") return renderResult();
  renderIntro();
}

const L5 = ["전혀 아니다", "아니다", "보통", "그렇다", "매우 그렇다"];
const L4 = ["A에 확실히 가깝다", "A에 조금 더 가깝다", "B에 조금 더 가깝다", "B에 확실히 가깝다"];
function radios(it, labels, cls) {
  const v = state.answers[it.id];
  return `<div class="lk ${cls}" role="radiogroup">${labels.map((lb, k) =>
    `<label title="${lb}"><input type="radio" id="q-${it.id}-${k + 1}" name="${it.id}" value="${k + 1}" ${v === k + 1 ? "checked" : ""} aria-label="${lb}"><span></span></label>`).join("")}</div>`;
}
function itemHTML(it, idx) {
  const n = `<span class="n">${String(idx).padStart(2, "0")}</span>`;
  if (it.kind === "fc") return `<div class="q" data-id="${it.id}">
      <p class="q-text">${n}둘 중 나의 진짜 이유에 더 가까운 쪽은?</p>
      <div class="fc"><p><b>A</b>${it.ta}</p><p><b>B</b>${it.tb}</p></div>
      <div class="scale"><span class="end">A</span>${radios(it, L4, "lk4")}<span class="end r">B</span></div>
    </div>`;
  return `<div class="q" data-id="${it.id}">
      <p class="q-text">${n}${it.text}</p>
      <div class="scale"><span class="end">아니다</span>${radios(it, L5, "lk5")}<span class="end r">그렇다</span></div>
    </div>`;
}

function renderQuiz() {
  const p = Math.min(state.page, PAGES - 1);
  const items = ITEMS.slice(p * PER_PAGE, (p + 1) * PER_PAGE);
  app.innerHTML = `
    <div class="prog">

  upd();
  app.querySelectorAll(".lk input").forEach(inp => inp.addEventListener("change", e => {
    state.answers[e.target.name] = +e.target.value; save(); upd();
    const q = e.target.closest(".q"); q.classList.remove("missing");
    const next = q.nextElementSibling;
    if (next && next.classList.contains("q") && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      if (next.getBoundingClientRect().top > innerHeight * 0.7) next.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }));
  document.getElementById("prev").onclick = () => p === 0 ? go("intro") : go("quiz", p - 1);
  document.getElementById("next").onclick = () => {
    const missing = items.filter(it => !isDone(it.id));
    if (missing.length) {
      missing.forEach(it => app.querySelector(`.q[data-id="${it.id}"]`).classList.add("missing"));
      document.getElementById("hint").textContent = `응답하지 않은 문항이 ${missing.length}개 있어요. 주황색으로 표시된 문항에 답해 주세요.`;
      app.querySelector(`.q[data-id="${missing[0].id}"]`).scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    if (p < PAGES - 1) return go("quiz", p + 1);
    const first = ITEMS.findIndex(i => !isDone(i.id));
    if (first >= 0) return go("quiz", Math.floor(first / PER_PAGE));
    go("result");
  };
}

// ---------- 채점 ----------
function score() {
  const A = state.answers;
  const vals = {}; for (let t = 1; t <= 9; t++) vals[t] = [];
  const inst = { sp: [], so: [], sx: [] };
  for (const it of ITEMS) {
    if (!isDone(it.id)) continue;
    const v = A[it.id];
    if (it.kind === "type") vals[it.t].push((v - 1) / 4 * 100);
    if (it.kind === "inst") inst[it.k].push((v - 1) / 4 * 100);
    if (it.kind === "fc") { const l = FC_LEAN[v]; vals[it.a].push(50 + l * 25); vals[it.b].push(50 - l * 25); }
  }
  const avg = a => a.length ? Math.round(a.reduce((s, x) => s + x, 0) / a.length) : 0;
  const types = {}; for (let t = 1; t <= 9; t++) types[t] = avg(vals[t]);
  const instincts = {}; for (const k in inst) instincts[k] = avg(inst[k]);
  const ranked = Object.keys(types).map(Number).sort((a, b) => types[b] - types[a]);
  const main = ranked[0];
  const left = main === 1 ? 9 : main - 1, right = main === 9 ? 1 : main + 1;
  const wing = types[left] >= types[right] ? left : right;
  const centers = {};
  for (const c in CENTER_INFO) centers[c] = Math.round(CENTER_INFO[c].types.reduce((s, t) => s + types[t], 0) / 3);
  // 트라이타입: 각 중심에서 가장 높은 유형을 점수 순으로
  const tri = Object.keys(CENTER_INFO).map(c => CENTER_INFO[c].types.reduce((b, t) => types[t] > types[b] ? t : b))
    .sort((a, b) => types[b] - types[a]);
  const instStack = Object.keys(instincts).sort((a, b) => instincts[b] - instincts[a]);
  return { types, ranked, main, wing, centers, tri, instincts, instStack };
}

// ---------- 에니어그램 도형 ----------
function figure(R) {
  const S = 300, c = S / 2, r = 108;
  const pos = t => { const ang = (-90 + (t % 9) * 40) * Math.PI / 180; return [c + r * Math.cos(ang), c + r * Math.sin(ang)]; };
  const line = (a, b, cls, extra = "") => { const [x1, y1] = pos(a), [x2, y2] = pos(b); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${cls} ${extra}/>`; };
  const base = 'stroke="var(--line)" stroke-width="1.5"';
  const hex = [1, 4, 2, 8, 5, 7, 1], trio = [3, 6, 9, 3];
  let s = `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="에니어그램 도형에 표시한 유형별 점수">`;
  s += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" ${base}/>`;
  for (let i = 0; i < hex.length - 1; i++) s += line(hex[i], hex[i + 1], base);
  for (let i = 0; i < trio.length - 1; i++) s += line(trio[i], trio[i + 1], base);
  s += line(R.main, GROWTH[R.main], 'stroke="var(--good)" stroke-width="3"');
  s += line(R.main, STRESS[R.main], 'stroke="var(--warn)" stroke-width="3" stroke-dasharray="5 4"');
  for (let t = 1; t <= 9; t++) {
    const [x, y] = pos(t), v = R.types[t], rad = 7 + v / 100 * 13, col = `var(--${CENTER[t]})`;
    const isMain = t === R.main;
    if (isMain) s += `<circle cx="${x}" cy="${y}" r="${rad + 5}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
    s += `<circle cx="${x}" cy="${y}" r="${rad}" fill="${col}" fill-opacity="${isMain ? 1 : 0.25 + v / 160}"/>`;
    const ang = (-90 + (t % 9) * 40) * Math.PI / 180;
    const lx = c + (r + 34) * Math.cos(ang), ly = c + (r + 34) * Math.sin(ang);
    s += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="15" fill="var(--ink)" font-weight="${isMain ? 700 : 400}">${t}</text>`;
  }
  return s + `</svg>`;
}

            <div class="track"><i style="width:${Math.max(R.types[t], 3)}%;background:var(--${CENTER[t]})"></i><em>${TYPES[t].name}${t === R.main ? " · 주유형" : t === R.wing ? " · 날개" : ""}</em></div>

          <span><i style="background:var(--gut)"></i>장 중심 (8 9 1)</span>
          <span><i style="background:var(--heart)"></i>가슴 중심 (2 3 4)</span>
          <span><i style="background:var(--head)"></i>머리 중심 (5 6 7)</span>
        </div>
        ${close ? `<p class="note"><strong>${R.main}번과 ${second}번의 점수 차이가 ${gap}점으로 가깝습니다.</strong> 두 유형의 핵심 두려움을 비교해 보세요. ${R.main}번은 '${T.fear}', ${second}번은 '${TYPES[second].fear}'을(를) 두려워합니다. 더 뜨끔한 쪽이 진짜 주유형일 가능성이 높습니다.</p>` : ""}
      </section>

      <section class="card">
        <div class="sec-h"><h3>세 가지 중심과 트라이타입</h3><small>각 중심에서 가장 강한 유형</small></div>
        <div class="trio">
          ${Object.keys(CENTER_INFO).map(cn => { const ci = CENTER_INFO[cn]; const best = R.tri.find(t => CENTER[t] === cn);
            return `<div><small>${ci.name} · ${ci.emo}</small><b style="color:var(--${cn})">${best}</b><span>중심 평균 ${R.centers[cn]}</span></div>`; }).join("")}
        </div>
        <p class="note">트라이타입 <strong>${tri}</strong>는 세 중심에서 각각 가장 강하게 나온 유형을 점수 순으로 늘어놓은 것입니다. 첫 번째가 주유형이고, 나머지 둘은 그 중심의 문제를 다룰 때 주로 꺼내 쓰는 방식입니다. ${CENTER_INFO[CENTER[R.main]].desc}</p>
      </section>

      <section class="card">
        <div class="sec-h"><h3>본능 순서</h3><small>에너지가 먼저 가는 영역</small></div>
        <div class="trio">
          ${R.instStack.map((k, i) => `<div><small>${["주본능", "2순위", "맹점 본능"][i]}</small><b>${k}</b><span>${INSTINCTS[k].name} · ${R.instincts[k]}</span></div>`).join("")}
        </div>

      </section>

      <section class="card">
        <div class="sec-h"><h3>${R.main}w${R.wing} 깊이 보기</h3><small>${T.name}</small></div>

        </div>

  const renderCombo = () => {
    const m = state.mbti, box = document.getElementById("combo");
    if (!m) { box.innerHTML = `<p class="note">MBTI를 고르면 이 결과와 얼마나 자주 함께 나타나는 조합인지 보여줍니다.</p>`; return; }
    const common = MBTI_COMMON[m];
    const rank = common.indexOf(R.main);
    const fit = rank === 0 ? "가장 흔한 조합입니다" : rank > 0 ? "흔한 조합에 속합니다" : "흔한 조합은 아니지만 충분히 존재합니다";
    const also = Object.entries(MBTI_COMMON).filter(([, v]) => v[0] === R.main).map(([k]) => k);
    let extra = "";
    if (m === "INTP" || m === "ENTP") {
      const lean = { 5: "INTP", 9: "INTP", 7: "ENTP", 3: "ENTP", 8: "ENTP" }[R.main];

  };
  renderCombo();
  document.getElementById("mbti").onchange = e => { state.mbti = e.target.value; save(); renderCombo(); };

  const summary = `[에니어그램 심층 검사 결과] ${R.main}w${R.wing} ${T.name}\n트라이타입 ${tri} · 본능 ${R.instStack.join("/")}\n` +
    order.map(t => `${t}번 ${R.types[t]}`).join(" · ");
  document.getElementById("copy").onclick = async () => {
    const toast = document.getElementById("toast");
    try { await navigator.clipboard.writeText(summary); toast.textContent = "결과를 클립보드에 복사했어요."; }
    catch (e) { const ta = document.getElementById("copyText"); ta.hidden = false; ta.value = summary; ta.style.width = "100%"; ta.rows = 4; ta.select(); toast.textContent = "자동 복사가 막혀 있어요. 선택된 텍스트를 직접 복사해 주세요."; }
  };
  document.getElementById("review").onclick = () => go("quiz", 0);
  document.getElementById("again").onclick = () => { state.answers = {}; go("intro", 0); };
}

render();
</script>
