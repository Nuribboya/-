<title>빅파이브 성격 검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: MBTI·에니어그램 검사와 같은 단일 컬럼 설문지. 결과는 5요인 막대 프로필 → 요인별 세부 6개 → 다른 검사와 교차 확인 */
:root {
  --bg: #eef0f4;
  --paper: #ffffff;
  --ink: #18202f;
  --muted: #5d6679;
  --line: #d8dce5;
  --o: #2f4fd8;   /* 개방성 */
  --c: #1f8a5b;   /* 성실성 */
  --e: #d9771f;   /* 외향성 */
  --a: #b5367a;   /* 우호성 */
  --n: #6b4fbf;   /* 신경성 */
  --good: #1f8a5b;
  --warn: #b5671a;
  --display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151e; --paper: #1a2030; --ink: #e8ebf2; --muted: #9aa3b6; --line: #2d3547;
    --o: #7f95ff; --c: #4fc28d; --e: #f0a35e; --a: #e77ab4; --n: #a98bf0; --good: #4fc28d; --warn: #e7a35a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151e; --paper: #1a2030; --ink: #e8ebf2; --muted: #9aa3b6; --line: #2d3547;
  --o: #7f95ff; --c: #4fc28d; --e: #f0a35e; --a: #e77ab4; --n: #a98bf0; --good: #4fc28d; --warn: #e7a35a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.65; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
button, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, .lk input:focus-visible + span { outline: 3px solid var(--o); outline-offset: 2px; }

.mast { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 24px; }
.mast h1 { font-family: var(--display); font-weight: 400; font-size: 26px; }
.mast .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.intro h2 { font-size: 22px; margin-bottom: 8px; }
.intro ul { margin: 0; padding-left: 20px; color: var(--muted); }
.intro li + li { margin-top: 4px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: 8px; padding: 12px 20px; font-weight: 600; background: var(--ink); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }

.prog { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; margin-bottom: 8px; }
.prog-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .3s; }

.q { padding: 20px 0; border-bottom: 1px solid var(--line); }
.q:last-of-type { border-bottom: 0; }
.q-text { font-size: 16px; font-weight: 500; margin-bottom: 14px; }
.q-text .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 8px; }
.q.missing .q-text { color: var(--warn); }
.scale { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.scale .end { font-size: 12px; color: var(--muted); white-space: nowrap; }
.lk { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.lk label { flex: 0 0 auto; display: grid; place-items: center; cursor: pointer; }
.lk input { position: absolute; opacity: 0; pointer-events: none; }
.lk span { display: block; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--ink) 30%, var(--line)); transition: background .15s, border-color .15s, transform .1s; }
.lk label:hover span { transform: scale(1.08); }
.lk input:checked + span { background: var(--ink); border-color: var(--ink); }
.lk label:nth-child(1) span, .lk label:nth-child(5) span { width: 38px; height: 38px; }
.lk label:nth-child(2) span, .lk label:nth-child(4) span { width: 30px; height: 30px; }
.lk label:nth-child(3) span { width: 22px; height: 22px; }
@media (max-width: 480px) {
  .scale { grid-template-columns: 1fr 1fr; }
  .scale .lk { grid-column: 1 / -1; grid-row: 1; }
  .scale .end.r { text-align: right; }
}
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
.hint { font-size: 13px; color: var(--warn); min-height: 1.4em; margin-top: 8px; text-align: right; }

/* 결과 */
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.profile { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.col { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.col .well { position: relative; width: 100%; max-width: 72px; height: 180px; background: var(--bg); border-radius: 6px; overflow: hidden; }
.col .fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 6px 6px 0 0; }
.col .ref { position: absolute; left: -2px; right: -2px; height: 0; border-top: 2px dashed var(--ink); opacity: .55; }
.col .letter { font-family: var(--display); font-size: 34px; line-height: 1; }
.col .nm { font-size: 12px; color: var(--muted); text-align: center; }
.col .val { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.col .lvl { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); white-space: nowrap; }
.col .lvl.hi, .col .lvl.lo { color: var(--ink); border-color: var(--ink); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 14px; flex-wrap: wrap; align-items: center; }
.legend .dash { display: inline-block; width: 18px; border-top: 2px dashed var(--ink); opacity: .55; margin-right: 6px; vertical-align: middle; }

.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.sec-h h3 { font-size: 17px; display: flex; gap: 10px; align-items: baseline; }
.sec-h h3 .big { font-family: var(--display); font-weight: 400; font-size: 26px; }
.sec-h small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.dom-desc { margin-bottom: 14px; max-width: 64ch; }
.facets { display: flex; flex-direction: column; gap: 9px; }
.f { display: grid; grid-template-columns: 112px 1fr 34px; gap: 10px; align-items: center; }
.f .nm { font-size: 13px; }
.f .nm small { display: block; font-size: 11px; color: var(--muted); line-height: 1.35; }
.f .track { height: 12px; background: var(--bg); border-radius: 6px; position: relative; overflow: hidden; }
.f .track i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; }
.f .v { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .f { grid-template-columns: 96px 1fr 30px; } }

.cmp { display: flex; flex-direction: column; gap: 8px; }
.cmp > div { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); padding-block: 6px; }
.cmp > div:last-child { border-bottom: 0; }
.cmp b { font-family: var(--mono); font-weight: 500; }
.cmp span { font-size: 13px; color: var(--muted); min-width: 0; }
.tag { font-size: 12px; border-radius: 999px; padding: 2px 10px; border: 1px solid currentColor; white-space: nowrap; }
.tag.ok { color: var(--good); }
.tag.no { color: var(--warn); }
.tag.mid { color: var(--muted); }
.pick { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.pick select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.est { font-family: var(--display); font-size: 40px; line-height: 1; letter-spacing: .04em; }
.note { font-size: 13px; color: var(--muted); margin-top: 12px; }
.note strong { color: var(--ink); }
.disclaimer { font-size: 12px; color: var(--muted); }
.toast { font-size: 13px; color: var(--good); min-height: 1.4em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="mast">
    <h1>빅파이브 성격 검사</h1>
    <span class="meta">120문항 · 5요인 30세부요인</span>
  </header>
  <main id="app"></main>
</div>

      { name: "충동성", d: "욕구 조절의 어려움", items: [["먹거나 노는 걸 한번 시작하면 폭주할 때가 있다.", 1], ["지나치게 빠져드는 일은 거의 없다.", -1], ["유혹을 쉽게 이겨낸다.", -1], ["무언가가 당겨도 잘 참는다.", -1]] },
      { name: "취약성", d: "압박에 무너짐", items: [["쉽게 당황하고 패닉에 빠진다.", 1], ["일이 몰리면 감당이 안 된다고 느낀다.", 1], ["상황을 내가 해결할 수 없을 것 같다고 느낄 때가 많다.", 1], ["압박 속에서도 침착함을 유지한다.", -1]] },
    ] },
];
const DOM = Object.fromEntries(DOMAINS.map(d => [d.k, d]));

// MBTI 각 글자와 가장 강하게 연결되는 요인
const MBTI_MAP = [
  { pos: 0, dom: "E", hi: "E", lo: "I" },
  { pos: 1, dom: "O", hi: "N", lo: "S" },
  { pos: 2, dom: "A", hi: "F", lo: "T" },
  { pos: 3, dom: "C", hi: "J", lo: "P" },
];
// 에니어그램 유형별로 자주 보이는 빅파이브 모양 (+1 높음, -1 낮음)
const ENNEA = {
  1: { name: "개혁가", exp: [["C", 1], ["N", 1]] },
  2: { name: "조력가", exp: [["A", 1], ["E", 1]] },
  3: { name: "성취자", exp: [["E", 1], ["C", 1], ["N", -1]] },
  4: { name: "개인주의자", exp: [["N", 1], ["O", 1], ["E", -1]] },
  5: { name: "탐구자", exp: [["E", -1], ["O", 1], ["A", -1]] },
  6: { name: "충성가", exp: [["N", 1], ["C", 1]] },
  7: { name: "열정가", exp: [["E", 1], ["O", 1], ["C", -1]] },
  8: { name: "도전자", exp: [["A", -1], ["E", 1], ["N", -1]] },
  9: { name: "평화주의자", exp: [["A", 1], ["N", -1], ["E", -1]] },
};

function buildItems() {
  const out = [];
  for (let i = 0; i < 4; i++) for (let f = 0; f < 6; f++) for (const k of ["N", "E", "O", "A", "C"]) {
    const [text, s] = DOM[k].facets[f].items[i];
    out.push({ id: `${k}${f}-${i}`, dom: k, f, s, text });
  }
  return out;
}
const ITEMS = buildItems();
const PER_PAGE = 10;
const PAGES = Math.ceil(ITEMS.length / PER_PAGE);

// ---------- 상태 ----------
const KEY = "bigfive-v1";
let state = { answers: {}, page: 0, view: "intro", mbti: "", ennea: "" };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.answers) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const app = document.getElementById("app");
const isDone = id => state.answers[id] != null;
const doneCount = () => ITEMS.filter(i => isDone(i.id)).length;
function go(view, page) { state.view = view; if (page != null) state.page = page; save(); render(); scrollTo(0, 0); }

function render() {
  if (state.view === "quiz") return renderQuiz();
  if (state.view === "result") return renderResult();
  renderIntro();
}

function renderIntro() {
  const n = doneCount();
  app.innerHTML = `
    <section class="card intro stack">
      <div>
        <h2>성격을 다섯 개의 점수로 봅니다</h2>
        <p>빅파이브는 성격 심리학 연구에서 가장 널리 쓰이는 모델입니다. 사람을 유형으로 나누지 않고 개방성, 성실성, 외향성, 우호성, 신경성 다섯 가지 연속된 점수로 보여주기 때문에 MBTI처럼 경계에 걸려서 애매해지는 일이 없습니다.</p>
      </div>
      <ul>
        <li>총 ${ITEMS.length}문항, 한 페이지에 ${PER_PAGE}문항씩 ${PAGES}페이지. 12~15분 정도 걸립니다.</li>
        <li>각 요인은 세부 요인 6개로 나뉘어서, 예를 들어 같은 외향성 중간이라도 사람 많은 곳을 좋아하는 쪽인지 짜릿함을 좋아하는 쪽인지 구분해 보여줍니다.</li>
        <li>지금의 나를 기준으로, 비슷한 또래와 비교해서 솔직하게 답해 주세요.</li>
        <li>결과에서 MBTI와 에니어그램 유형을 고르면 세 검사가 서로 맞는지 비교해 줍니다.</li>
        <li>답변은 이 브라우저에만 저장되고 다른 곳으로 전송되지 않습니다.</li>
      </ul>
      <div class="row">
        <button class="btn" id="start">${n === ITEMS.length ? "답변 처음부터 보기" : n ? `이어서 하기 (${n}/${ITEMS.length})` : "검사 시작"}</button>
        ${n === ITEMS.length ? `<button class="btn ghost" id="toResult">결과 보기</button>` : ""}
        ${n ? `<button class="btn ghost" id="reset">처음부터 다시</button>` : ""}
      </div>
    </section>`;
  document.getElementById("start").onclick = () => {
    const first = ITEMS.findIndex(i => !isDone(i.id));
    go("quiz", first < 0 ? 0 : Math.floor(first / PER_PAGE));
  };
  const t = document.getElementById("toResult"); if (t) t.onclick = () => go("result");
  const r = document.getElementById("reset"); if (r) r.onclick = () => { state.answers = {}; go("quiz", 0); };
}

const L5 = ["전혀 아니다", "아니다", "보통", "그렇다", "매우 그렇다"];
function renderQuiz() {
  const p = Math.min(state.page, PAGES - 1);
  const items = ITEMS.slice(p * PER_PAGE, (p + 1) * PER_PAGE);
  app.innerHTML = `
    <div class="prog">
      <div class="prog-top"><span>${p + 1} / ${PAGES} 페이지</span><span id="cnt"></span></div>
      <div class="bar"><i id="barfill"></i></div>
    </div>
    <section class="card">
      ${items.map((it, i) => { const idx = p * PER_PAGE + i + 1, v = state.answers[it.id];
        return `<div class="q" data-id="${it.id}">
          <p class="q-text"><span class="n">${String(idx).padStart(3, "0")}</span>${it.text}</p>
          <div class="scale"><span class="end">아니다</span>
            <div class="lk" role="radiogroup" aria-label="${idx}번 문항">${L5.map((lb, k) =>
              `<label title="${lb}"><input type="radio" id="q-${it.id}-${k + 1}" name="${it.id}" value="${k + 1}" ${v === k + 1 ? "checked" : ""} aria-label="${lb}"><span></span></label>`).join("")}</div>
            <span class="end r">그렇다</span></div>
        </div>`; }).join("")}
      <div class="nav">
        <button class="btn ghost" id="prev">${p === 0 ? "처음으로" : "이전"}</button>
        <button class="btn" id="next">${p === PAGES - 1 ? "결과 보기" : "다음"}</button>
      </div>
      <p class="hint" id="hint"></p>
    </section>`;
  const upd = () => {
    const n = doneCount();
    document.getElementById("barfill").style.width = (n / ITEMS.length * 100) + "%";
    document.getElementById("cnt").textContent = `${n} / ${ITEMS.length} 응답`;
  };
  upd();
  app.querySelectorAll(".lk input").forEach(inp => inp.addEventListener("change", e => {
    state.answers[e.target.name] = +e.target.value; save(); upd();
    const q = e.target.closest(".q"); q.classList.remove("missing");
    const next = q.nextElementSibling;
    if (next && next.classList.contains("q") && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      if (next.getBoundingClientRect().top > innerHeight * 0.7) next.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }));
  document.getElementById("prev").onclick = () => p === 0 ? go("intro") : go("quiz", p - 1);
  document.getElementById("next").onclick = () => {
    const missing = items.filter(it => !isDone(it.id));
    if (missing.length) {
      missing.forEach(it => app.querySelector(`.q[data-id="${it.id}"]`).classList.add("missing"));
      document.getElementById("hint").textContent = `응답하지 않은 문항이 ${missing.length}개 있어요. 주황색으로 표시된 문항에 답해 주세요.`;
      app.querySelector(`.q[data-id="${missing[0].id}"]`).scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    if (p < PAGES - 1) return go("quiz", p + 1);
    const first = ITEMS.findIndex(i => !isDone(i.id));
    if (first >= 0) return go("quiz", Math.floor(first / PER_PAGE));
    go("result");
  };
}

// ---------- 채점 ----------
const BAND = 12;   // 기준선에서 ±12점을 넘으면 높음/낮음
function level(k, v) {
  const d = v - DOM[k].ref;
  return d > BAND ? "hi" : d < -BAND ? "lo" : "mid";
}
const LV = { hi: "높음", mid: "중간", lo: "낮음" };
function score() {
  const A = state.answers;
  const facets = {}, domains = {};
  for (const d of DOMAINS) {
    facets[d.k] = d.facets.map((_, f) => {
      const its = ITEMS.filter(i => i.dom === d.k && i.f === f && isDone(i.id));
      if (!its.length) return 50;
      const sum = its.reduce((s, it) => s + (it.s > 0 ? A[it.id] : 6 - A[it.id]), 0);   // 1..5
      return Math.round((sum / its.length - 1) / 4 * 100);
    });
    domains[d.k] = Math.round(facets[d.k].reduce((s, x) => s + x, 0) / 6);
  }
  return { facets, domains };
}

// ---------- 결과 ----------
function renderResult() {
  const R = score();
  const est = MBTI_MAP.map(m => { const d = R.domains[m.dom] - DOM[m.dom].ref; return { ...m, d, letter: d >= 0 ? m.hi : m.lo }; });
  const estType = est.map(e => e.letter).join("");
  const mbtiOpts = ["ISTJ","ISFJ","INFJ","INTJ","ISTP","ISFP","INFP","INTP","ESTP","ESFP","ENFP","ENTP","ESTJ","ESFJ","ENFJ","ENTJ"]
    .map(m => `<option value="${m}" ${state.mbti === m ? "selected" : ""}>${m}</option>`).join("");
  const enOpts = Object.keys(ENNEA).map(t => `<option value="${t}" ${String(state.ennea) === t ? "selected" : ""}>${t}번 ${ENNEA[t].name}</option>`).join("");

  app.innerHTML = `
    <div class="stack">

        <p class="eyebrow">나의 5요인 프로필</p>
        <div class="profile">
          ${DOMAINS.map(d => { const v = R.domains[d.k], lv = level(d.k, v);
            return `<div class="col">
              <div class="well"><span class="fill" style="height:${Math.max(v, 2)}%;background:var(--${d.k.toLowerCase()})"></span><span class="ref" style="bottom:${d.ref}%"></span></div>
              <span class="val">${v}</span>
              <span class="letter" style="color:var(--${d.k.toLowerCase()})">${d.k}</span>

        </div>

      </section>

      ${DOMAINS.map(d => { const v = R.domains[d.k], lv = level(d.k, v); const col = `var(--${d.k.toLowerCase()})`;
        return `<section class="card">
          <div class="sec-h"><h3><span class="big" style="color:${col}">${d.k}</span>${d.name} · ${LV[lv]}</h3><small>${v}점 · 평균 약 ${d.ref}</small></div>
          <p class="dom-desc">${d[lv]}</p>
          <div class="facets">
            ${d.facets.map((f, i) => `<div class="f">

          </div>
        </section>`; }).join("")}

      <section class="card">

        <p class="est">${estType}</p>
        <p class="note">외향성은 E/I, 개방성은 S/N, 우호성은 T/F, 성실성은 J/P와 가장 강하게 연결됩니다. 평균선보다 높으면 앞 글자, 낮으면 뒤 글자로 추정했습니다.</p>
        <div class="pick" style="margin-top:14px"><label for="mbti">MBTI 검사 결과</label><select id="mbti"><option value="">선택하세요</option>${mbtiOpts}</select></div>
        <div id="mbtiCmp"></div>
      </section>

      <section class="card">
        <div class="sec-h"><h3>에니어그램과 비교</h3><small>유형별로 자주 보이는 빅파이브 모양</small></div>
        <div class="pick"><label for="ennea">에니어그램 주유형</label><select id="ennea"><option value="">선택하세요</option>${enOpts}</select></div>
        <div id="enCmp"></div>
      </section>

      <section class="card stack">
        <div class="row">
          <button class="btn" id="copy">결과 복사</button>
          <button class="btn ghost" id="review">답변 수정</button>
          <button class="btn ghost" id="again">다시 검사</button>
        </div>
        <p class="toast" id="toast" aria-live="polite"></p>
        <textarea id="copyText" readonly hidden></textarea>
        <p class="disclaimer">문항은 공개 문항 풀인 IPIP(International Personality Item Pool)의 IPIP-NEO 120 구조를 따라 한국어로 옮기고 일부를 한국 상황에 맞게 바꾼 것입니다. 공식 번안본이나 표준화된 규준이 아니므로 평균선은 대략적인 참고값입니다. 자기 이해를 위한 참고로만 활용하세요.</p>
      </section>
    </div>`;

  const lvTag = (k) => { const lv = level(k, R.domains[k]); return `<span class="tag ${lv === "mid" ? "mid" : ""}">${DOM[k].name} ${LV[lv]}</span>`; };

  const renderMbti = () => {
    const box = document.getElementById("mbtiCmp"), m = state.mbti;
    if (!m) { box.innerHTML = `<p class="note">MBTI 검사에서 나온 유형을 고르면 글자별로 빅파이브 결과와 맞는지 보여줍니다.</p>`; return; }
    const rows = est.map(e => {

      return `<div><b>${e.hi}/${e.lo}</b><span>MBTI ${mine} · 빅파이브 ${DOM[e.dom].name} ${R.domains[e.dom]}점 (평균 대비 ${e.d >= 0 ? "+" : ""}${e.d})</span>${tag}</div>`;
    }).join("");
    const ex = R.facets.E, en = DOM.E.facets;

      (ex[1] < 50 && (ex[4] >= 55 || ex[2] >= 55)
        ? "사람 많은 곳은 싫어하지만 주도하거나 자극을 찾는 성향은 있는 모양입니다. 내향형처럼 보이는 외향 직관형(ENxP)에서 자주 나타납니다."
        : ex[1] >= 55 ? "많은 사람과 어울리는 걸 즐기는 쪽이라 외향 성향이 분명한 편입니다."
        : "전반적으로 사람과의 접촉에서 에너지를 얻기보다 조용한 쪽을 편하게 느끼는 모양입니다.") + "</p>";
    box.innerHTML = `<div class="cmp">${rows}</div>${eiNote}`;
  };
  const renderEn = () => {
    const box = document.getElementById("enCmp"), t = state.ennea;
    if (!t) { box.innerHTML = `<p class="note">에니어그램 검사에서 나온 주유형을 고르면 그 유형에서 흔한 빅파이브 모양과 비교합니다.</p>`; return; }
    const exp = ENNEA[t].exp;
    let hit = 0;
    const rows = exp.map(([k, dir]) => {
      const lv = level(k, R.domains[k]);
      const ok = (dir > 0 && lv === "hi") || (dir < 0 && lv === "lo");
      const part = lv === "mid";
      if (ok) hit++;
      return `<div><b>${k}</b><span>${t}번에서 흔함: ${DOM[k].name} ${dir > 0 ? "높음" : "낮음"} · 내 결과 ${R.domains[k]}점 ${LV[lv]}</span><span class="tag ${ok ? "ok" : part ? "mid" : "no"}">${ok ? "일치" : part ? "애매" : "다름"}</span></div>`;
    }).join("");
    box.innerHTML = `<div class="cmp">${rows}</div>
      <p class="note"><strong>${exp.length}개 중 ${hit}개 일치.</strong> ${hit === exp.length ? `${t}번에서 흔히 보이는 모양과 잘 맞습니다.` : hit ? `일부는 맞고 일부는 다릅니다. 에니어그램은 동기를, 빅파이브는 행동 경향을 재기 때문에 어느 정도 차이는 자연스럽습니다.` : `흔한 모양과는 거리가 있습니다. 에니어그램 1~2위 유형이 붙어 있었다면 2위 유형도 골라서 비교해 보세요.`}</p>`;
  };
  renderMbti(); renderEn();
  document.getElementById("mbti").onchange = e => { state.mbti = e.target.value; save(); renderMbti(); };
  document.getElementById("ennea").onchange = e => { state.ennea = e.target.value; save(); renderEn(); };

  const summary = `[빅파이브 성격 검사 결과]\n` +
    DOMAINS.map(d => `${d.name}(${d.k}) ${R.domains[d.k]} ${LV[level(d.k, R.domains[d.k])]} · ` + d.facets.map((f, i) => `${f.name} ${R.facets[d.k][i]}`).join(", ")).join("\n") +
    `\n빅파이브 기준 MBTI 추정: ${estType}`;
  document.getElementById("copy").onclick = async () => {
    const toast = document.getElementById("toast");
    try { await navigator.clipboard.writeText(summary); toast.textContent = "결과를 클립보드에 복사했어요."; }
    catch (e) { const ta = document.getElementById("copyText"); ta.hidden = false; ta.value = summary; ta.style.width = "100%"; ta.rows = 7; ta.select(); toast.textContent = "자동 복사가 막혀 있어요. 선택된 텍스트를 직접 복사해 주세요."; }
  };
  document.getElementById("review").onclick = () => go("quiz", 0);
  document.getElementById("again").onclick = () => { state.answers = {}; go("intro", 0); };
}

render();
</script>
