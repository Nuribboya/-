<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>토플 필수 단어장 - 하루 50개</title>
<style>
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --ink: #23201b;
    --sub: #6b6459;
    --line: #e4ddd0;
    --accent: #8a5a3b;
    --accent-ink: #ffffff;
    --chip: #f0e9dc;
    --syn: #2f6f4e;
    --ant: #a3402c;
    --done-bg: #eef6ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  .meta {
    color: var(--sub);
    font-size: 0.92rem;
  }
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .progress-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .bar {
    flex: 1;
    min-width: 160px;
    height: 10px;
    background: var(--chip);
    border-radius: 6px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width .2s;
  }
  .progress-text {
    font-size: 0.9rem;
    color: var(--sub);
    white-space: nowrap;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  thead th {
    text-align: left;
    font-size: 0.82rem;
    color: var(--sub);
    background: var(--chip);
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
    font-size: 0.94rem;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.done { background: var(--done-bg); }
  td.num { color: var(--sub); width: 34px; }
  td.word { font-weight: 700; white-space: nowrap; }
  td.pos { color: var(--sub); font-style: italic; width: 46px; }
  .tag {
    display: inline-block;
    margin: 1px 4px 1px 0;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 0.8rem;
  }
  .tag.syn { background: #e5f2ea; color: var(--syn); }
  .tag.ant { background: #f7e7e2; color: var(--ant); }
  td.check { width: 30px; text-align: center; }
  input[type="checkbox"] { width: 17px; height: 17px; cursor: pointer; }
  footer.note {
    margin-top: 18px;
    color: var(--sub);
    font-size: 0.85rem;
  }

  @media (max-width: 700px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr { border-bottom: 2px solid var(--line); padding: 10px 12px; }
    tbody td { border-bottom: none; padding: 3px 0; }
    td.check { text-align: left; }
    td.num::before { content: "#" attr(data-label) " "; }
  }

  @media print {
    body { background: #fff; }
    header.top .controls, .progress-card, footer.note, .no-print { display: none !important; }
    .wrap { max-width: 100%; padding: 0; }
    table { border: none; font-size: 11pt; }
    thead th { background: #fff !important; border-bottom: 1.5px solid #000; }
    tbody td { border-bottom: 1px solid #ccc; }
    td.check { display: none; }
    thead th:last-child { display: none; }
    h1 { font-size: 18pt; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>토플 필수 단어장</h1>
      <div class="meta" id="metaLine">불러오는 중...</div>
    </div>
    <div class="controls no-print">
      <button id="prevBtn" title="어제 목록 보기">◀ 이전 날</button>
      <button id="todayBtn">오늘로</button>
      <button id="nextBtn" title="다음 날 목록 미리보기">다음 날 ▶</button>
      <button id="shuffleBtn" title="날짜와 상관없이 지금 바로 무작위 50개">🔀 랜덤으로 새로 뽑기</button>
      <button class="primary" id="printBtn">🖨 인쇄하기</button>
    </div>
  </header>

  <div class="progress-card no-print">
    <div class="progress-text" id="progressText">0 / 50 암기 완료</div>
    <div class="bar"><div class="bar-fill" id="progressBar"></div></div>
    <button id="resetBtn" title="이 목록의 체크를 모두 해제">체크 초기화</button>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:34px;">#</th>
        <th>단어</th>
        <th>품사</th>
        <th>뜻</th>
        <th>동의어</th>
        <th>반의어</th>
        <th class="no-print">암기</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <footer class="note">
    매일 자정을 기준으로 새로운 50개 단어가 무작위 순서로 표시됩니다. 전체 단어은행(<span id="bankSize"></span>개)을
    겹치지 않게 한 바퀴 다 돌면 다음 바퀴는 다시 새로 섞입니다. 당장 새 단어를 보고 싶으면
    <strong>🔀 랜덤으로 새로 뽑기</strong>를 누르면 그 자리에서 바로 무작위 50개를 다시 뽑아줍니다.
    체크한 암기 여부는 이 브라우저에만 저장됩니다. 단어를 더 추가하려면 <code>words.js</code> 파일을 편집하세요.
  </footer>

</div>

<script src="words.js"></script>
<script>
(function () {
  const WORDS = window.TOEFL_WORDS || [];
  const PER_DAY = 50;
  const totalPages = Math.max(1, Math.ceil(WORDS.length / PER_DAY));
  const EPOCH = new Date(2024, 0, 1); // 기준일 (임의)
  EPOCH.setHours(0, 0, 0, 0);

  function todayIndex() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return Math.floor((today - EPOCH) / 86400000);
  }

  let dayOffset = 0; // 0 = 오늘, -1 = 어제, +1 = 내일 ...
  let manualDraw = null; // { id, list } — "랜덤으로 새로 뽑기"를 누르면 설정됨

  // 매 사이클(단어은행 전체 길이만큼)마다 다른 시드로 카드 순서를 무작위로 섞는다.
  // 같은 사이클 안에서는 겹치는 단어 없이 전체를 한 바퀴 돈 뒤, 다음 사이클엔 다시 새로 섞인다.
  function floorDiv(a, b) { return Math.floor(a / b); }
  function mod(a, b) { return ((a % b) + b) % b; }

  function mulberry32(seed) {
    let s = seed >>> 0;
    return function () {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffleIndices(n, rand) {
    const a = Array.from({ length: n }, (_, i) => i);
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const cycleCache = {};
  function orderForCycle(cycle) {
    if (!cycleCache[cycle]) cycleCache[cycle] = shuffleIndices(WORDS.length, mulberry32(cycle));
    return cycleCache[cycle];
  }

  function wordsForDayIndex(dIdx) {
    const cycle = floorDiv(dIdx, totalPages);
    const page = mod(dIdx, totalPages);
    const order = orderForCycle(cycle);
    const start = page * PER_DAY;
    let idxSlice = order.slice(start, start + PER_DAY);
    if (idxSlice.length < PER_DAY) idxSlice = idxSlice.concat(order.slice(0, PER_DAY - idxSlice.length));
    return { cycle, page, list: idxSlice.map(i => WORDS[i]) };
  }

  // 완전 무작위 추첨: 매번 진짜 난수로 새로 섞어 50개를 뽑는다 (날짜와 무관).
  function drawRandomSet() {
    const rand = (window.crypto && crypto.getRandomValues)
      ? () => crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296
      : Math.random;
    const order = shuffleIndices(WORDS.length, rand);
    const list = order.slice(0, PER_DAY).map(i => WORDS[i]);
    return { id: Date.now(), list };
  }

  function fmtDate(idx) {
    const d = new Date(EPOCH.getTime() + idx * 86400000);
    return d.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
  }

  function storageKey(key) {
    return "toefl_vocab_done_" + key;
  }

  function loadDone(key) {
    try {
      return JSON.parse(localStorage.getItem(storageKey(key)) || "[]");
    } catch (e) {
      return [];
    }
  }

  function saveDone(key, arr) {
    try {
      localStorage.setItem(storageKey(key), JSON.stringify(arr));
    } catch (e) {}
  }

  function currentView() {
    if (manualDraw) {
      return { key: "manual_" + manualDraw.id, list: manualDraw.list, meta: `🔀 랜덤 추첨 · 단어은행 ${WORDS.length}개 중 무작위 ${manualDraw.list.length}개` };
    }
    const dIdx = todayIndex() + dayOffset;
    const { cycle, page, list } = wordsForDayIndex(dIdx);
    const label = dayOffset === 0 ? "오늘" : dayOffset < 0 ? `${-dayOffset}일 전` : `${dayOffset}일 후`;
    return { key: "d" + dIdx, list, meta: `${fmtDate(dIdx)} (${label}) · Cycle ${cycle + 1} · Day ${page + 1} / ${totalPages} · 단어 ${list.length}개` };
  }

  function render() {
    const { key, list, meta } = currentView();
    const done = new Set(loadDone(key));

    document.getElementById("metaLine").textContent = meta;
    document.getElementById("bankSize").textContent = WORDS.length;

    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";
    list.forEach((item, i) => {
      const tr = document.createElement("tr");
      const isDone = done.has(item.w);
      if (isDone) tr.classList.add("done");

      const syn = (item.s || []).map(x => `<span class="tag syn">${x}</span>`).join("");
      const ant = (item.a || []).filter(Boolean).map(x => `<span class="tag ant">${x}</span>`).join("") || "-";

      tr.innerHTML = `
        <td class="num" data-label="번호">${i + 1}</td>
        <td class="word">${item.w}</td>
        <td class="pos">${item.p}</td>
        <td>${item.k}</td>
        <td>${syn}</td>
        <td>${ant}</td>
        <td class="check no-print"><input type="checkbox" ${isDone ? "checked" : ""} data-word="${item.w}"></td>
      `;
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener("change", () => {
        const d = new Set(loadDone(key));
        if (cb.checked) d.add(cb.dataset.word); else d.delete(cb.dataset.word);
        saveDone(key, Array.from(d));
        cb.closest("tr").classList.toggle("done", cb.checked);
        updateProgress(key, list.length);
      });
    });

    updateProgress(key, list.length);
  }

  function updateProgress(key, total) {
    const done = loadDone(key).length;
    document.getElementById("progressText").textContent = `${done} / ${total} 암기 완료`;
    document.getElementById("progressBar").style.width = `${total ? (done / total) * 100 : 0}%`;
  }

  document.getElementById("prevBtn").addEventListener("click", () => { manualDraw = null; dayOffset -= 1; render(); });
  document.getElementById("nextBtn").addEventListener("click", () => { manualDraw = null; dayOffset += 1; render(); });
  document.getElementById("todayBtn").addEventListener("click", () => { manualDraw = null; dayOffset = 0; render(); });
  document.getElementById("shuffleBtn").addEventListener("click", () => { manualDraw = drawRandomSet(); render(); });
  document.getElementById("printBtn").addEventListener("click", () => window.print());
  document.getElementById("resetBtn").addEventListener("click", () => {
    const { key } = currentView();
    saveDone(key, []);
    render();
  });

  render();
})();
</script>
</body>
</html>
