:root {
  --bg: #eef0f4;

  --ink: #18202f;
  --muted: #5d6679;
  --line: #d8dce5;
  --pole-a: #2f4fd8;   /* E S T J 쪽 */
  --pole-b: #d9771f;   /* I N F P 쪽 */
  --soft-a: #e3e8fb;
  --soft-b: #fbeadb;

  --warn: #b5671a;
  --display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {

    --bg: #11151e; --paper: #1a2030; --ink: #e8ebf2; --muted: #9aa3b6; --line: #2d3547;
    --pole-a: #7f95ff; --pole-b: #f0a35e; --soft-a: #232c4d; --soft-b: #3a2a1c;
    --good: #4fc28d; --warn: #e7a35a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151e; --paper: #1a2030; --ink: #e8ebf2; --muted: #9aa3b6; --line: #2d3547;

  --good: #4fc28d; --warn: #e7a35a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.65; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, .lk input:focus-visible + span { outline: 3px solid var(--pole-a); outline-offset: 2px; }

.mast { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 24px; }
.mast h1 { font-family: var(--display); font-weight: 400; font-size: 26px; letter-spacing: .01em; }
.mast .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
.stack { display: flex; flex-direction: column; gap: 16px; }

/* intro */
.intro h2 { font-size: 22px; margin-bottom: 8px; }
.intro ul { margin: 12px 0 0; padding-left: 20px; color: var(--muted); }
.intro li + li { margin-top: 4px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: 8px; padding: 12px 20px; font-weight: 600; background: var(--ink); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .35; cursor: not-allowed; }

/* progress */
.prog { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; margin-bottom: 8px; }
.prog-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .3s; }

/* question */
.q { padding: 20px 0; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; }
.q-text { font-size: 16px; font-weight: 500; margin-bottom: 14px; }
.q-text .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 8px; }
.scale { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.scale .end { font-size: 12px; color: var(--muted); white-space: nowrap; }
.lk { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.lk label { flex: 0 0 auto; display: grid; place-items: center; cursor: pointer; }
.lk input { position: absolute; opacity: 0; pointer-events: none; }
.lk span { display: block; border-radius: 50%; border: 2px solid var(--line); transition: background .15s, border-color .15s, transform .1s; }
.lk7 label:nth-child(1) span, .lk7 label:nth-child(7) span { width: 38px; height: 38px; }
.lk7 label:nth-child(2) span, .lk7 label:nth-child(6) span { width: 32px; height: 32px; }
.lk7 label:nth-child(3) span, .lk7 label:nth-child(5) span { width: 26px; height: 26px; }
.lk7 label:nth-child(4) span { width: 20px; height: 20px; }
.lk7 label:nth-child(-n+3) span { border-color: color-mix(in srgb, var(--pole-b) 55%, var(--line)); }
.lk7 label:nth-child(n+5) span { border-color: color-mix(in srgb, var(--pole-a) 55%, var(--line)); }
.lk7 label:nth-child(-n+3) input:checked + span { background: var(--pole-b); border-color: var(--pole-b); }
.lk7 label:nth-child(n+5) input:checked + span { background: var(--pole-a); border-color: var(--pole-a); }
.lk7 label:nth-child(4) input:checked + span { background: var(--muted); border-color: var(--muted); }

.lk4 { justify-content: space-around; }
.lk4 label span { width: 30px; height: 30px; border-color: color-mix(in srgb, var(--ink) 35%, var(--line)); }
.lk4 label:nth-child(1) span, .lk4 label:nth-child(4) span { width: 38px; height: 38px; }
.lk4 label input:checked + span { background: var(--ink); border-color: var(--ink); }
.fc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.fc p { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.fc b { font-family: var(--mono); font-weight: 500; color: var(--muted); }

.amb div { border: 1px solid var(--warn); border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; }
.amb b { font-family: var(--mono); font-weight: 500; }
.amb span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.q.missing .q-text { color: var(--warn); }

.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
.hint { font-size: 13px; color: var(--warn); min-height: 1.4em; margin-top: 8px; text-align: right; }

.code b { font-weight: 400; }
.code .a { color: var(--pole-a); }
.code .b { color: var(--pole-b); }
.nick { font-size: 20px; font-weight: 700; }
.oneliner { color: var(--muted); margin-top: 6px; max-width: 60ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }

.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.sec-h h3 { font-size: 17px; }
.sec-h small { color: var(--muted); font-size: 12px; }

.axis + .axis { margin-top: 18px; }
.axis-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; gap: 8px; }
.axis-top .a { color: var(--pole-a); }
.axis-top .b { color: var(--pole-b); text-align: right; }

.fn-list { display: flex; flex-direction: column; gap: 8px; }

.fn.in-stack .track i { background: var(--pole-a); opacity: 1; }

.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 12px; flex-wrap: wrap; }

.match > div { border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.match .t { font-family: var(--display); font-size: 26px; }
.match .s { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.match .st { font-size: 12px; color: var(--muted); margin-top: 2px; }
.match > div.me { border-color: var(--pole-a); background: var(--soft-a); }
@media (max-width: 480px) { .match { grid-template-columns: 1fr; } }
.note { font-size: 13px; color: var(--muted); margin-top: 12px; }

.stackline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
.stackline > div { border-top: 3px solid var(--ink); padding-top: 6px; }
.stackline > div:nth-child(2) { border-color: color-mix(in srgb, var(--ink) 70%, transparent); }

.stackline small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.stackline b { font-family: var(--mono); font-weight: 500; font-size: 16px; }
.stackline span { display: block; font-size: 12px; color: var(--muted); }
@media (max-width: 480px) { .stackline { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.deep { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 22px; }
.deep h4 { font-size: 13px; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
.deep ul { margin: 0; padding-left: 18px; }
.deep li + li { margin-top: 3px; }
.deep .full { grid-column: 1 / -1; }

.disclaimer { font-size: 12px; color: var(--muted); }
.toast { font-size: 13px; color: var(--good); min-height: 1.4em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

// ---------- 문항 구성 ----------
// 본 검사: 지표 리커트 60 + 기능 리커트 32 + 양자택일 16 = 108문항
// 확인 문항: 지표별 6개, 기능 쌍별 4개. 결과가 애매한 부분만 골라서 추가로 묻는다
function buildItems() {
  const ax = [], fn = [], fc = [], extra = [];
  for (let i = 0; i < AXIS_LIKERT; i++) for (const a of AXES) {
    const [text, s] = AXIS_ITEMS[a.id][i];
    ax.push({ id: `${a.id}${i}`, kind: "axis", axis: a.id, s, text });
  }
  for (let i = 0; i < FUNC_LIKERT; i++) for (const f of Object.keys(FUNC_ITEMS)) {
    fn.push({ id: `${f}${i}`, kind: "fn", fn: f, text: FUNC_ITEMS[f][i] });
  }
  const groups = [
    ...AXES.map(a => [a.id, FC_AXIS[a.id]]),
    ...PAIRS.map(([x, y]) => [`${x}-${y}`, FC_PAIR[`${x}-${y}`]]),
  ];
  const maxLen = Math.max(...groups.map(g => g[1].length));
  for (let i = 0; i < maxLen; i++) for (const [dim, list] of groups) {
    if (!list[i]) continue;
    const [pole, ta, tb] = list[i];
    (i < FC_BASE ? fc : extra).push({ id: `fc-${dim}${i}`, kind: "fc", dim, pole, ta, tb });
  }
  // 지표 4 : 기능 2 : 양자택일 1 비율로 고르게 섞음
  const pattern = [ax, ax, fn, ax, fc, ax, fn];
  const main = [];
  while (ax.length || fn.length || fc.length) {
    for (const src of pattern) if (src.length) main.push(src.shift());
  }
  return { main, extra };
}
const { main: MAIN, extra: EXTRA } = buildItems();
const BY_ID = Object.fromEntries([...MAIN, ...EXTRA].map(it => [it.id, it]));
const PER_PAGE = 10;
const FC_LEAN = { 1: 2, 2: 1, 3: -1, 4: -2 };   // A 확실 / A 쪽 / B 쪽 / B 확실

// ---------- 상태 ----------
const KEY = "mbti-deep-v1";
let state = { answers: {}, page: 0, view: "intro", queue: [] };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.answers) state = Object.assign(state, s); } catch (e) {}
if (!Array.isArray(state.queue) || !state.queue.length) state.queue = MAIN.map(i => i.id);
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const app = document.getElementById("app");
const isDone = id => state.answers[id] != null;
const mainDone = () => MAIN.filter(i => isDone(i.id)).length;
const extraDone = () => EXTRA.filter(i => isDone(i.id)).length;

function startQueue(ids) {
  state.queue = ids; state.page = 0; state.view = "quiz";
  save(); render(); scrollTo(0, 0);
}
function resumeMain() {
  const left = MAIN.filter(i => !isDone(i.id)).map(i => i.id);
  startQueue(left.length ? left : MAIN.map(i => i.id));
}

// ---------- 화면 ----------
function render() {
  if (state.view === "quiz") return renderQuiz();
  if (state.view === "check") return renderCheck();
  if (state.view === "result") return renderResult();
  renderIntro();
}

const LIKERT_LABELS = ["전혀 아니다", "아니다", "약간 아니다", "보통", "약간 그렇다", "그렇다", "매우 그렇다"];
const FC_LABELS = ["A에 확실히 가깝다", "A에 조금 더 가깝다", "B에 조금 더 가깝다", "B에 확실히 가깝다"];

function renderQuiz() {
  const Q = state.queue.filter(id => BY_ID[id]);
  const pages = Math.max(1, Math.ceil(Q.length / PER_PAGE));
  const p = Math.min(state.page, pages - 1);
  const items = Q.slice(p * PER_PAGE, (p + 1) * PER_PAGE).map(id => BY_ID[id]);
  const isExtra = items.length && items.every(it => EXTRA.includes(it));
  app.innerHTML = `
    <div class="prog">
      <div class="prog-top"><span>${isExtra ? "확인 문항 · " : ""}${p + 1} / ${pages} 페이지</span><span id="cnt"></span></div>
      <div class="bar"><i id="barfill"></i></div>
    </div>
    <section class="card">
      ${items.map((it, i) => itemHTML(it, p * PER_PAGE + i + 1)).join("")}
      <div class="nav">
        <button class="btn ghost" id="prev">${p === 0 ? "처음으로" : "이전"}</button>
        <button class="btn" id="next">${p === pages - 1 ? "결과 보기" : "다음"}</button>
      </div>
      <p class="hint" id="hint"></p>
    </section>`;
  const updateProgress = () => {
    const n = Q.filter(isDone).length;
    document.getElementById("barfill").style.width = (n / Q.length * 100) + "%";
    document.getElementById("cnt").textContent = `${n} / ${Q.length} 응답`;
  };
  updateProgress();
  app.querySelectorAll(".lk input").forEach(inp => inp.addEventListener("change", e => {
    state.answers[e.target.name] = +e.target.value; save(); updateProgress();
    const q = e.target.closest(".q"); q.classList.remove("missing");
    const next = q.nextElementSibling;
    if (next && next.classList.contains("q") && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const r = next.getBoundingClientRect();
      if (r.top > innerHeight * 0.7) next.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }));
  document.getElementById("prev").onclick = () => {
    if (p === 0) state.view = "intro"; else state.page = p - 1;
    save(); render(); scrollTo(0, 0);
  };
  document.getElementById("next").onclick = () => {
    const missing = items.filter(it => !isDone(it.id));
    if (missing.length) {
      missing.forEach(it => app.querySelector(`.q[data-id="${it.id}"]`).classList.add("missing"));
      document.getElementById("hint").textContent = `응답하지 않은 문항이 ${missing.length}개 있어요. 주황색으로 표시된 문항에 답해 주세요.`;
      app.querySelector(`.q[data-id="${missing[0].id}"]`).scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    if (p === pages - 1) {
      const firstMissing = Q.findIndex(id => !isDone(id));
      if (firstMissing >= 0) { state.page = Math.floor(firstMissing / PER_PAGE); save(); render(); return; }
      if (MAIN.some(i => !isDone(i.id))) return resumeMain();
      state.view = ambiguous(score()).length ? "check" : "result";
    } else state.page = p + 1;
    save(); render(); scrollTo(0, 0);
  };
}

// ---------- 애매한 부분 확인 ----------
const AMBIG_GAP = 10;      // 지표: 50±10% 이내, 기능 쌍: 점수 차 10점 미만
const PER_ROUND = 3;       // 한 번에 묻는 확인 문항 수 (차원별)
function ambiguous(R) {
  const out = [];
  for (const a of AXES) {
    if (Math.abs(R.axes[a.id].pctA - 50) < AMBIG_GAP) out.push({ dim: a.id, label: `${a.a} / ${a.b}`, why: `${a.a} ${R.axes[a.id].pctA}% · ${a.b} ${R.axes[a.id].pctB}%` });
  }
  for (const [x, y] of PAIRS) {
    if (Math.abs(R.funcs[x] - R.funcs[y]) < AMBIG_GAP) out.push({ dim: `${x}-${y}`, label: `${x} / ${y}`, why: `${x} ${R.funcs[x]} · ${y} ${R.funcs[y]}` });
  }
  return out
    .map(d => ({ ...d, ids: EXTRA.filter(i => i.dim === d.dim && !isDone(i.id)).slice(0, PER_ROUND).map(i => i.id) }))
    .filter(d => d.ids.length);
}
function renderCheck() {
  const amb = ambiguous(score());
  if (!amb.length) { state.view = "result"; save(); return render(); }
  const ids = amb.flatMap(d => d.ids);
  // 차원이 번갈아 나오도록 섞기
  const mixed = [];
  for (let i = 0; i < PER_ROUND; i++) for (const d of amb) if (d.ids[i]) mixed.push(d.ids[i]);
  app.innerHTML = `
    <section class="card stack">
      <div>
        <p class="eyebrow">거의 다 왔어요</p>
        <h2 style="font-size:20px;margin-top:4px">아래 항목이 50:50에 가깝게 나왔어요</h2>
      </div>
      <div class="amb">${amb.map(d => `<div><b>${d.label}</b><span>${d.why}</span></div>`).join("")}</div>
      <p>비슷한 두 성향을 직접 비교하는 확인 문항 ${ids.length}개를 더 풀면 이 부분을 더 정확하게 가를 수 있어요. 두 문장 중 평소의 나에 더 가까운 쪽을 골라 주세요.</p>
      <div class="row">
        <button class="btn" id="more">확인 문항 ${ids.length}개 풀기</button>
        <button class="btn ghost" id="skip">지금 결과 보기</button>
      </div>
    </section>`;
  document.getElementById("more").onclick = () => startQueue(mixed);
  document.getElementById("skip").onclick = () => { state.view = "result"; save(); render(); scrollTo(0, 0); };
}

// ---------- 채점 ----------
function score() {
  const A = state.answers;
  const all = [...MAIN, ...EXTRA].filter(it => isDone(it.id));
  const axes = {};
  for (const a of AXES) {
    let sum = 0, max = 0;
    for (const it of all) {
      if (it.kind === "axis" && it.axis === a.id) { sum += (A[it.id] - 4) * it.s; max += 3; }          // -3..+3
      if (it.kind === "fc" && it.dim === a.id) { sum += FC_LEAN[A[it.id]] * 1.5 * (it.pole === a.a ? 1 : -1); max += 3; }
    }
    const pctA = max ? Math.round(50 + (sum / max) * 50) : 50;   // 첫 글자 쪽 비율
    axes[a.id] = { pctA, pctB: 100 - pctA, letter: pctA >= 50 ? a.a : a.b };
  }
  const vals = Object.fromEntries(Object.keys(FUNCS).map(f => [f, []]));
  for (const it of all) {
    if (it.kind === "fn") vals[it.fn].push((A[it.id] - 1) / 6 * 100);
    if (it.kind === "fc" && it.dim.includes("-")) {
      const [x, y] = it.dim.split("-");
      const other = it.pole === x ? y : x;
      const lean = FC_LEAN[A[it.id]];
      vals[it.pole].push(50 + lean * 25);
      vals[other].push(50 - lean * 25);
    }
  }
  const funcs = {};
  for (const f of Object.keys(FUNCS)) {
    const v = vals[f];
    funcs[f] = v.length ? Math.round(v.reduce((s, x) => s + x, 0) / v.length) : 50;
  }
  const type = AXES.map(a => axes[a.id].letter).join("");
  // 기능 프로파일 매칭: 유형별 기대 프로필과 사용자 점수의 상관계수
  const ideal = [100, 78, 52, 32];
  const keys = Object.keys(FUNCS);
  const u = keys.map(k => funcs[k]);
  const fits = Object.entries(TYPES).map(([t, d]) => {
    const e = keys.map(k => { const i = d.stack.indexOf(k); return i >= 0 ? ideal[i] : 20; });
    return { t, r: pearson(u, e) };
  }).sort((x, y) => y.r - x.r);
  return { axes, funcs, type, fits };
}
function pearson(x, y) {
  const n = x.length, mx = x.reduce((a, b) => a + b) / n, my = y.reduce((a, b) => a + b) / n;
  let num = 0, dx = 0, dy = 0;
  for (let i = 0; i < n; i++) { num += (x[i] - mx) * (y[i] - my); dx += (x[i] - mx) ** 2; dy += (y[i] - my) ** 2; }
  return dx && dy ? num / Math.sqrt(dx * dy) : 0;
}
function clarity(p) {
  const d = Math.abs(p - 50);
  if (d < 6) return "경계";
  if (d < 16) return "약간";
  if (d < 31) return "뚜렷";
  return "매우 뚜렷";
}

// ---------- 결과 화면 ----------
function renderResult() {
  const R = score();
  const T = TYPES[R.type];
  const borderline = AXES.filter(a => Math.abs(R.axes[a.id].pctA - 50) < 6);
  const alt = borderline.length ? R.type.split("").map((ch, i) => {
    const a = AXES[i]; return borderline.includes(a) ? (ch === a.a ? a.b : a.a) : ch;
  }).join("") : null;
  const myRank = R.fits.findIndex(f => f.t === R.type) + 1;
  const top3 = R.fits.slice(0, 3);
  const fnSorted = Object.entries(R.funcs).sort((a, b) => b[1] - a[1]);
  const roles = ["주기능", "부기능", "3차 기능", "열등 기능"];

  let consistency;
  if (myRank === 1) consistency = `<strong>지표 결과와 인지기능 결과가 일치합니다.</strong> 네 글자 유형과 실제로 자주 쓰는 기능의 순서가 같은 그림을 가리키고 있어서 신뢰도가 높은 결과입니다.`;
  else if (myRank <= 3) consistency = `<strong>대체로 일치합니다.</strong> 인지기능 기준으로는 ${R.type}가 ${myRank}순위입니다. 1순위로 나온 ${top3[0].t}의 설명도 함께 읽어보고 더 와닿는 쪽을 참고하세요.`;
  else consistency = `<strong>지표와 인지기능 결과가 다르게 나왔습니다.</strong> 인지기능 기준 1순위는 ${top3[0].t}입니다. 상황에 따라 다르게 행동하거나, 되고 싶은 모습으로 답했을 가능성이 있어요. 두 유형 설명을 비교해 보는 걸 추천합니다.`;

  const leftMain = MAIN.filter(i => !isDone(i.id)).length;
  const amb = leftMain ? [] : ambiguous(R);
  const ambIds = [];
  for (let i = 0; i < PER_ROUND; i++) for (const d of amb) if (d.ids[i]) ambIds.push(d.ids[i]);
  const banner = leftMain
    ? `<section class="card stack"><div class="sec-h"><h3>새 문항 ${leftMain}개가 추가됐어요</h3><small>기존 답변은 그대로 유지</small></div>
        <p>애매하게 나오던 지표를 더 정확히 가르기 위해 문항을 늘렸어요. 아래 결과는 지금까지의 답변만으로 계산한 거라, 새 문항까지 풀면 더 정확해집니다.</p>
        <div class="row"><button class="btn" id="resume">새 문항 ${leftMain}개 풀기</button></div></section>`
    : amb.length
    ? `<section class="card stack"><div class="sec-h"><h3>아직 50:50에 가까운 항목이 있어요</h3><small>확인 문항 ${ambIds.length}개</small></div>
        <div class="amb">${amb.map(d => `<div><b>${d.label}</b><span>${d.why}</span></div>`).join("")}</div>
        <div class="row"><button class="btn" id="more">확인 문항 더 풀기</button></div></section>`
    : "";

  app.innerHTML = `
    <div class="stack">
      ${banner}
      <section class="card hero">
        <p class="eyebrow">당신의 유형</p>
        <div class="code" aria-label="${R.type}">${R.type.split("").map((ch, i) => `<b class="${ch === AXES[i].a ? "a" : "b"}">${ch}</b>`).join("")}</div>
        <p class="nick">${T.nick}</p>
        <p class="oneliner">${T.one}</p>
        <div class="chips">
          ${AXES.map(a => { const ax = R.axes[a.id]; const p = Math.max(ax.pctA, ax.pctB); const c = clarity(ax.pctA);
            return `<span class="chip ${c === "경계" ? "warn" : ""}">${ax.letter} ${p}% · ${c}</span>`; }).join("")}
          ${alt ? `<span class="chip warn">경계 유형: ${alt}</span>` : ""}
        </div>
      </section>

      <section class="card">
        <div class="sec-h"><h3>4가지 지표</h3><small>가운데에서 멀수록 선호가 뚜렷함</small></div>
        ${AXES.map(a => { const ax = R.axes[a.id]; const left = 100 - ax.pctA; const col = ax.pctA >= 50 ? "var(--pole-a)" : "var(--pole-b)";
          return `<div class="axis">
            <div class="axis-top"><span class="a">${a.a} · ${a.an}</span><span>${a.desc}</span><span class="b">${a.bn} · ${a.b}</span></div>
            <div class="axis-bar"><span class="mid"></span><span class="dot" style="left:${left}%;background:${col}"></span></div>
            <div class="axis-foot"><span>${ax.pctA}%</span><span class="cl">${clarity(ax.pctA)}</span><span>${ax.pctB}%</span></div>
          </div>`; }).join("")}
        ${borderline.length ? `<p class="note">${borderline.map(a => `${a.a}/${a.b}`).join(", ")} 지표가 50% 근처입니다. 이 지표는 상황에 따라 양쪽 모습을 모두 보일 수 있어서 <strong>${alt}</strong> 설명도 함께 참고하면 좋습니다.</p>` : ""}
      </section>

      <section class="card">
        <div class="sec-h"><h3>인지기능 사용 정도</h3><small>0~100, 높을수록 자주 씀</small></div>
        <div class="fn-list">
          ${fnSorted.map(([k, v]) => { const i = T.stack.indexOf(k);
            return `<div class="fn ${i >= 0 ? "in-stack" : ""}">
              <span class="k">${k}</span>
              <div class="track"><i style="width:${Math.max(v, 3)}%"></i><em>${FUNCS[k].name}${i >= 0 ? " · " + roles[i] : ""}</em></div>
              <span class="v">${v}</span>
            </div>`; }).join("")}
        </div>
        <div class="legend"><span><i style="background:var(--pole-a)"></i>${R.type}의 기능 스택</span><span><i style="background:var(--muted);opacity:.35"></i>그 외 (그림자 기능)</span></div>
      </section>

      <section class="card">
        <div class="sec-h"><h3>인지기능으로 본 유형</h3><small>기능 점수 패턴과 각 유형 스택의 일치도</small></div>
        <div class="match">
          ${top3.map((f, i) => `<div class="${f.t === R.type ? "me" : ""}">
            <span class="s">${i + 1}순위 · 일치도 ${Math.round(Math.max(0, f.r) * 100)}%</span>
            <div class="t">${f.t}</div>
            <div class="st">${TYPES[f.t].stack.join(" · ")}</div>
          </div>`).join("")}
        </div>
        <p class="note">${consistency}</p>
      </section>

      <section class="card">
        <div class="sec-h"><h3>${R.type} 깊이 보기</h3><small>${T.nick}</small></div>
        <div class="stackline">
          ${T.stack.map((k, i) => `<div><small>${roles[i]}</small><b>${k}</b><span>${FUNCS[k].short}</span></div>`).join("")}
        </div>
        <div class="deep">
          <div class="full"><h4>주기능 ${T.stack[0]}</h4><p>${FUNCS[T.stack[0]].desc} 부기능 ${T.stack[1]}(${FUNCS[T.stack[1]].short})이 이를 보완해 균형을 잡습니다.</p></div>
          <div><h4>강점</h4><ul>${T.str.map(s => `<li>${s}</li>`).join("")}</ul></div>
          <div><h4>맹점</h4><ul>${T.weak.map(s => `<li>${s}</li>`).join("")}</ul></div>
          <div class="full"><h4>스트레스 받을 때</h4><p>${T.stress}</p></div>
          <div class="full"><h4>성장 포인트</h4><p>${T.grow}</p></div>
          <div><h4>관계에서</h4><p>${T.love}</p></div>
          <div><h4>잘 맞는 일</h4><p>${T.work}</p></div>
        </div>
      </section>

      <section class="card stack">
        <div class="row">
          <button class="btn" id="copy">결과 복사</button>
          <button class="btn ghost" id="review">답변 수정</button>
          <button class="btn ghost" id="again">다시 검사</button>
        </div>
        <p class="toast" id="toast" aria-live="polite"></p>
        <textarea id="copyText" readonly hidden></textarea>
        <p class="disclaimer">이 검사는 MBTI 이론과 융의 인지기능 개념을 바탕으로 만든 자가 진단용 검사이며, 공식 MBTI® 검사(Myers-Briggs Company)가 아닙니다. 성격은 고정된 상자가 아니라 경향이므로, 결과는 자기 이해를 위한 참고로만 활용하세요.</p>
      </section>
    </div>`;

  const summary = `[MBTI 심층 검사 결과] ${R.type} · ${T.nick}\n` +
    AXES.map(a => { const ax = R.axes[a.id]; return `${a.a} ${ax.pctA}% / ${a.b} ${ax.pctB}% (${clarity(ax.pctA)})`; }).join("\n") +
    `\n기능 순위: ${fnSorted.map(([k, v]) => `${k} ${v}`).join(" > ")}\n인지기능 기준 1순위: ${top3[0].t}`;
  document.getElementById("copy").onclick = async () => {
    const toast = document.getElementById("toast");
    try { await navigator.clipboard.writeText(summary); toast.textContent = "결과를 클립보드에 복사했어요."; }
    catch (e) { const ta = document.getElementById("copyText"); ta.hidden = false; ta.value = summary; ta.style.width = "100%"; ta.rows = 6; ta.select(); toast.textContent = "자동 복사가 막혀 있어요. 선택된 텍스트를 직접 복사해 주세요."; }
  };
  document.getElementById("review").onclick = () => startQueue([...MAIN, ...EXTRA].filter(i => isDone(i.id)).map(i => i.id));
  document.getElementById("again").onclick = () => { state = { answers: {}, page: 0, view: "intro", queue: MAIN.map(i => i.id) }; save(); render(); scrollTo(0, 0); };
  const rs = document.getElementById("resume"); if (rs) rs.onclick = resumeMain;
  const mo = document.getElementById("more"); if (mo) mo.onclick = () => startQueue(ambIds);
}

render();
</script>
