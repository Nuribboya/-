<title>나의 직업 흥미 코드</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --ground: #F3F5F2;
    --surface: #FFFFFF;
    --ink: #17201C;
    --muted: #5B6862;
    --line: #D9DFDB;
    --accent: #2F4BD8;
    --accent-ink: #FFFFFF;
    --accent-soft: #E6EAFB;
    --R: #C8553D; --I: #2F6FB0; --A: #9B4DB5;
    --S: #2E9E6B; --E: #C9820F; --C: #5A6B7A;
    --display: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #111614; --surface: #1A211E; --ink: #E8EEEA; --muted: #9AA8A1;
      --line: #2C3632; --accent: #8397FF; --accent-ink: #0E1330; --accent-soft: #232B4A;
      --R: #E57B63; --I: #6FA6E0; --A: #C387DA; --S: #5CC897; --E: #EDB24A; --C: #9AAABA;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #111614; --surface: #1A211E; --ink: #E8EEEA; --muted: #9AA8A1;
    --line: #2C3632; --accent: #8397FF; --accent-ink: #0E1330; --accent-soft: #232B4A;
    --R: #E57B63; --I: #6FA6E0; --A: #C387DA; --S: #5CC897; --E: #EDB24A; --C: #9AAABA;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--body); font-size: 16px; line-height: 1.6;
    padding-inline: 16px; padding-block: 32px 64px;
  }
  .wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; }
  h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
  h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 800; line-height: 1.2; }
  h2 { font-size: 22px; font-weight: 800; }
  h3 { font-size: 18px; font-weight: 600; }
  p { margin: 0; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .lede { color: var(--muted); max-width: 60ch; }

  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
    padding: 12px 18px; font-weight: 600;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  /* 인트로 */
  .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 560px) { .types { grid-template-columns: repeat(2, 1fr); } }
  .type-chip { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline; padding: 12px 0; border-top: 2px solid var(--c); }
  .type-chip b { font-family: var(--mono); font-size: 20px; color: var(--c); grid-row: span 2; }
  .type-chip span { font-weight: 600; }
  .type-chip small { color: var(--muted); font-size: 13px; }
  .meta { color: var(--muted); font-size: 14px; }

  /* 문항 */
  .quiz { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(20px, 5vw, 36px); display: grid; gap: 24px; }
  .progress { display: grid; gap: 8px; }
  .progress-top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }
  .question { font-family: var(--display); font-size: clamp(20px, 4.4vw, 26px); font-weight: 600; line-height: 1.45; min-height: 3em; text-wrap: balance; }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .scale button {
    border: 1px solid var(--line); background: var(--ground); border-radius: 12px;
    padding: 14px 6px; display: grid; gap: 4px; justify-items: center; font-size: 13px; color: var(--muted);
    transition: border-color .15s, background .15s;
  }
  .scale button b { font-family: var(--mono); font-size: 18px; color: var(--ink); }
  .scale button:hover { border-color: var(--accent); }
  .scale button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  @media (max-width: 520px) {
    .scale { grid-template-columns: 1fr; }
    .scale button { grid-template-columns: 28px 1fr; justify-items: start; text-align: left; padding: 12px 14px; font-size: 15px; color: var(--ink); }
  }
  .hint { font-size: 13px; color: var(--muted); }

  /* 결과 */
  .code-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  .code { font-family: var(--mono); font-weight: 600; font-size: clamp(48px, 13vw, 76px); line-height: 1; letter-spacing: 0.06em; }
  .code span:nth-child(1) { color: var(--c1); } .code span:nth-child(2) { color: var(--c2); } .code span:nth-child(3) { color: var(--c3); }
  .chart-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: center; }
  @media (max-width: 620px) { .chart-grid { grid-template-columns: 1fr; } }
  .hex { width: 100%; max-width: 340px; margin: 0 auto; display: block; }
  .scores { display: grid; gap: 10px; }
  .score { display: grid; grid-template-columns: 76px 1fr 40px; gap: 10px; align-items: center; font-size: 14px; }
  .score .name { font-weight: 600; }
  .score .name b { font-family: var(--mono); color: var(--c); margin-right: 4px; }
  .score .track { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .score .track i { display: block; height: 100%; background: var(--c); border-radius: 99px; }
  .score .num { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

  .notes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 560px) { .notes { grid-template-columns: 1fr; } }
  .note { border-left: 3px solid var(--line); padding-left: 14px; display: grid; gap: 4px; }
  .note .k { font-size: 13px; color: var(--muted); }
  .note .v { font-weight: 600; }
  .note p { font-size: 14px; color: var(--muted); }

  .top-types { display: grid; gap: 16px; }
  .top-type { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
  .top-type header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .top-type .rank { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .top-type .letter { font-family: var(--mono); font-size: 28px; font-weight: 600; color: var(--c); line-height: 1; }
  .top-type .kw { display: flex; flex-wrap: wrap; gap: 6px; }
  .top-type .kw span { font-size: 13px; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .jobs { display: flex; flex-wrap: wrap; gap: 8px; }
  .jobs span { font-size: 14px; padding: 6px 12px; border-radius: 8px; background: var(--ground); }
  .combo { background: var(--accent-soft); border-radius: 14px; padding: 20px; display: grid; gap: 10px; }
  .combo .jobs span { background: var(--surface); }
  .disclaimer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
  .toast { font-size: 13px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">

  <!-- 인트로 -->
  <section id="intro" class="wrap" style="gap:24px">
    <div style="display:grid;gap:12px">
      <p class="eyebrow">Holland RIASEC 흥미 검사</p>
      <h1>나한테 맞는 일은 뭘까?</h1>
      <p class="lede">36개 문장에 얼마나 공감하는지 골라 주세요. 홀랜드(Holland)의 6가지 직업 흥미 유형 중 어디에 가까운지 계산해서, 나의 3글자 흥미 코드와 어울리는 직업을 알려 드려요.</p>
    </div>
    <div class="types" id="typeLegend"></div>
    <div class="row">
      <button class="btn primary" id="startBtn" type="button">검사 시작하기</button>
      <button class="btn" id="resumeBtn" type="button" hidden>이어서 하기</button>
      <span class="meta">약 5분 · 정답 없음 · 떠오르는 대로 답하기</span>
    </div>
  </section>

  <!-- 문항 -->
  <section id="quiz" class="quiz" hidden aria-live="polite">
    <div class="progress">
      <div class="progress-top"><span id="progText">1 / 36</span><span id="progPct">0%</span></div>
      <div class="bar"><i id="progBar"></i></div>
    </div>
    <p class="question" id="qText"></p>
    <div class="scale" id="scale" role="group" aria-label="응답 선택"></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="prevBtn" type="button">← 이전</button>
      <span class="hint">키보드 1–5로도 선택할 수 있어요</span>
    </div>
  </section>

  <!-- 결과 -->
  <section id="result" class="wrap" hidden></section>
</div>

<script>
(function () {
  const TYPES = {
    R: { name: "현실형", en: "Realistic", tag: "손과 도구로 직접 만든다",
         desc: "눈에 보이는 결과를 좋아하고, 기계·도구·몸을 쓰는 구체적인 일에서 힘이 나는 타입이에요. 말보다 실행이 빠르고 실용적인 해결책을 잘 찾아요.",
         kw: ["실용적", "손재주", "솔직함", "끈기"],
         jobs: ["기계·자동차 엔지니어", "전기·전자 기술자", "항공 정비사", "셰프·조리사", "건축·인테리어 시공", "소방관·경찰", "조경·농업 전문가", "로봇·드론 운용"] },
    I: { name: "탐구형", en: "Investigative", tag: "원리를 파고든다",
         desc: "‘왜?’라는 질문을 끝까지 붙잡는 타입이에요. 분석하고, 가설을 세우고, 근거로 결론을 내리는 과정 자체를 즐겨요.",
         kw: ["분석적", "호기심", "논리", "독립적"],
         jobs: ["연구원·과학자", "데이터 사이언티스트", "소프트웨어 엔지니어", "의사·약사", "경제·금융 분석가", "생명공학자", "AI 엔지니어"] },
    A: { name: "예술형", en: "Artistic", tag: "나만의 방식으로 표현한다",
         desc: "상상력과 감각이 강하고, 정해진 틀보다 자유로운 환경에서 빛나는 타입이에요. 아이디어를 글·그림·소리·영상으로 바꾸는 데 재능이 있어요.",
         kw: ["창의적", "감수성", "독창성", "자유로움"],
         jobs: ["UX·시각 디자이너", "작가·카피라이터", "영상 PD·편집자", "작곡가·음향 감독", "건축가", "게임 기획·아트", "사진작가"] },
    S: { name: "사회형", en: "Social", tag: "사람을 돕고 키운다",
         desc: "사람에게서 에너지를 얻고, 누군가를 돕거나 가르칠 때 보람을 크게 느끼는 타입이에요. 공감 능력과 소통이 강점이에요.",
         kw: ["공감", "협력", "배려", "소통"],
         jobs: ["교사·강사", "상담사·심리치료사", "간호사", "사회복지사", "물리·작업치료사", "HR·인재개발 담당자", "청소년 지도사"] },
    E: { name: "진취형", en: "Enterprising", tag: "사람을 이끌고 목표를 이룬다",
         desc: "목표를 정하면 사람과 자원을 움직여 성과를 만들어 내는 타입이에요. 설득력과 추진력이 좋고, 경쟁과 도전에서 동기를 얻어요.",
         kw: ["리더십", "설득력", "도전", "추진력"],
         jobs: ["창업가", "마케터", "영업·세일즈 매니저", "변호사", "경영 컨설턴트", "서비스 기획자·PM", "MD·바이어"] },
    C: { name: "관습형", en: "Conventional", tag: "체계를 세우고 정확하게 처리한다",
         desc: "정리·계획·확인에 강하고, 규칙이 명확한 환경에서 안정적으로 성과를 내는 타입이에요. 꼼꼼함과 책임감이 가장 큰 무기예요.",
         kw: ["꼼꼼함", "계획성", "책임감", "정확성"],
         jobs: ["회계사·세무사", "공무원·행정직", "은행원·금융 사무", "품질관리(QA)", "데이터 관리자", "비서·총무", "물류·재고 관리"] }
  };
  const ORDER = ["R", "I", "A", "S", "E", "C"];

  const ITEMS = {
    R: ["고장 난 물건을 직접 분해하고 고쳐 보는 게 재밌다.",
        "몸을 움직이며 일하는 게 책상에 오래 앉아 있는 것보다 좋다.",
        "공구나 기계를 다루는 데 자신 있다.",
        "캠핑·등산처럼 야외에서 하는 활동을 좋아한다.",
        "조립, 목공, 요리처럼 결과물이 눈에 보이는 손작업을 즐긴다.",
        "말보다 행동으로 문제를 해결하는 편이다."],
    I: ["어떤 현상의 원리를 알아내기 전까지 궁금해서 못 참는다.",
        "어려운 수학·과학 문제를 오래 붙잡고 푸는 게 즐겁다.",
        "데이터를 보고 패턴이나 원인을 찾아내는 게 재밌다.",
        "다큐멘터리나 과학 기사를 즐겨 본다.",
        "결론을 내리기 전에 근거를 꼼꼼히 확인한다.",
        "혼자 깊이 생각하고 분석하는 시간이 꼭 필요하다."],
    A: ["그림, 음악, 글, 영상 같은 걸로 뭔가 만들어 내는 걸 좋아한다.",
        "정해진 방식보다 나만의 방식으로 하는 게 좋다.",
        "디자인이나 색감, 분위기에 민감한 편이다.",
        "상상하거나 새로운 아이디어를 떠올리는 게 즐겁다.",
        "규칙이 많고 틀에 박힌 환경은 답답하게 느껴진다.",
        "내 감정이나 생각을 작품으로 표현하고 싶다."],
    S: ["친구 고민을 들어주고 도와주는 게 보람 있다.",
        "누군가에게 뭔가를 가르쳐 주는 게 재밌다.",
        "혼자보다 팀으로 협력해서 일하는 게 좋다.",
        "다른 사람의 기분 변화를 잘 알아차린다.",
        "봉사활동이나 사람을 돕는 일에 관심이 많다.",
        "누군가 나 덕분에 성장하는 걸 보면 뿌듯하다."],
    E: ["모임이나 팀에서 앞장서서 이끄는 편이다.",
        "사람들을 설득해서 내 의견에 동의하게 만드는 데 자신 있다.",
        "경쟁에서 이기는 게 큰 동기부여가 된다.",
        "언젠가 내 사업을 해서 돈을 벌어 보고 싶다.",
        "위험이 좀 있어도 기회라고 생각되면 도전한다.",
        "목표를 세우고 사람들을 움직여 달성하는 게 좋다."],
    C: ["계획표를 세우고 그대로 지키는 게 편하다.",
        "자료를 깔끔하게 정리하고 분류하는 걸 좋아한다.",
        "숫자나 세부 사항에서 실수를 잘 찾아낸다.",
        "규칙과 절차가 명확한 환경이 편하다.",
        "맡은 일은 꼼꼼하게 끝까지 마무리한다.",
        "엑셀이나 표로 정리하는 작업이 잘 맞는다."]
  };
  // R I A S E C 순서로 번갈아 섞어서 한 유형이 몰리지 않게 한다
  const QUESTIONS = [];
  for (let i = 0; i < 6; i++) ORDER.forEach(t => QUESTIONS.push({ t, text: ITEMS[t][i] }));

  const SCALE = ["전혀 아니다", "아니다", "보통이다", "그렇다", "매우 그렇다"];
  const STORE_KEY = "riasec-answers-v1";

  const $ = id => document.getElementById(id);
  let answers = new Array(QUESTIONS.length).fill(null);
  let idx = 0;

  function load() {
    try { const a = JSON.parse(localStorage.getItem(STORE_KEY)); if (Array.isArray(a) && a.length === QUESTIONS.length) return a; } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(answers)); } catch (e) {} }
  function clearSave() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

  // 인트로 범례
  $("typeLegend").innerHTML = ORDER.map(k =>
    `<div class="type-chip" style="--c:var(--${k})"><b>${k}</b><span>${TYPES[k].name}</span><small>${TYPES[k].tag}</small></div>`).join("");

  const saved = load();
  if (saved && saved.some(v => v !== null)) {
    const done = saved.filter(v => v !== null).length;
    $("resumeBtn").hidden = false;
    $("resumeBtn").textContent = done === QUESTIONS.length ? "지난 결과 보기" : `이어서 하기 (${done}/${QUESTIONS.length})`;
  }

  // 응답 버튼
  $("scale").innerHTML = SCALE.map((s, i) =>
    `<button type="button" data-v="${i}" aria-pressed="false"><b>${i + 1}</b>${s}</button>`).join("");
  $("scale").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    choose(+b.dataset.v);
  });

  function show(section) {
    ["intro", "quiz", "result"].forEach(s => $(s).hidden = s !== section);
    window.scrollTo({ top: 0 });
  }

  function renderQ() {
    const q = QUESTIONS[idx];
    const done = answers.filter(v => v !== null).length;
    $("qText").textContent = q.text;
    $("progText").textContent = `${idx + 1} / ${QUESTIONS.length}`;
    $("progPct").textContent = Math.round(done / QUESTIONS.length * 100) + "%";
    $("progBar").style.width = (done / QUESTIONS.length * 100) + "%";
    $("scale").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === answers[idx])));
    $("prevBtn").disabled = idx === 0;
  }

  let locked = false;
  function choose(v) {
    if (locked) return;
    answers[idx] = v; save(); renderQ();
    locked = true;
    setTimeout(() => {
      locked = false;
      const next = answers.findIndex((a, i) => a === null && i > idx);
      const any = answers.indexOf(null);
      if (next !== -1) idx = next;
      else if (any !== -1) idx = any;
      else { showResult(); return; }
      renderQ();
    }, 180);
  }

  $("startBtn").addEventListener("click", () => {
    answers = new Array(QUESTIONS.length).fill(null); idx = 0; clearSave();
    show("quiz"); renderQ();
  });
  $("resumeBtn").addEventListener("click", () => {
    answers = load() || answers;
    const any = answers.indexOf(null);
    if (any === -1) { showResult(); return; }
    idx = any; show("quiz"); renderQ();
  });
  $("prevBtn").addEventListener("click", () => { if (idx > 0) { idx--; renderQ(); } });
  document.addEventListener("keydown", e => {
    if ($("quiz").hidden) return;
    if (e.key >= "1" && e.key <= "5") choose(+e.key - 1);
    else if (e.key === "ArrowLeft" && idx > 0) { idx--; renderQ(); }
  });

  // ---- 점수 계산 ----
  function scores() {
    const raw = Object.fromEntries(ORDER.map(k => [k, 0]));
    QUESTIONS.forEach((q, i) => raw[q.t] += answers[i] ?? 0);
    const max = 4 * 6;
    return Object.fromEntries(ORDER.map(k => [k, Math.round(raw[k] / max * 100)]));
  }
  function hexDistance(a, b) {
    const d = Math.abs(ORDER.indexOf(a) - ORDER.indexOf(b));
    return Math.min(d, 6 - d); // 1=인접, 2=한 칸 건너, 3=정반대
  }

  function hexSVG(sc) {
    const cx = 170, cy = 165, R = 118;
    const pt = (i, r) => {
      const ang = -Math.PI / 2 + i * Math.PI / 3;
      return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
    };
    const ring = f => ORDER.map((_, i) => pt(i, R * f).map(n => n.toFixed(1)).join(",")).join(" ");
    const shape = ORDER.map((k, i) => pt(i, R * Math.max(sc[k], 2) / 100).map(n => n.toFixed(1)).join(",")).join(" ");
    let g = "";
    [0.25, 0.5, 0.75, 1].forEach(f => g += `<polygon points="${ring(f)}" fill="none" stroke="var(--line)" stroke-width="1"/>`);
    ORDER.forEach((_, i) => { const [x, y] = pt(i, R); g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`; });
    g += `<polygon points="${shape}" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
    ORDER.forEach((k, i) => {
      const [x, y] = pt(i, R * Math.max(sc[k], 2) / 100);
      g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="var(--${k})"/>`;
      const [lx, ly] = pt(i, R + 26);
      g += `<text x="${lx.toFixed(1)}" y="${(ly - 2).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="16" fill="var(--${k})">${k}</text>`;
      g += `<text x="${lx.toFixed(1)}" y="${(ly + 14).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--muted)">${TYPES[k].name}</text>`;
    });
    return `<svg class="hex" viewBox="0 0 340 335" role="img" aria-label="6가지 유형 점수 육각형 그래프">${g}</svg>`;
  }

  function showResult() {
    const sc = scores();
    const ranked = [...ORDER].sort((a, b) => sc[b] - sc[a] || ORDER.indexOf(a) - ORDER.indexOf(b));
    const code = ranked.slice(0, 3);
    const spread = sc[ranked[0]] - sc[ranked[5]];
    const dist = hexDistance(code[0], code[1]);

    const consistency = [
      null,
      { v: "높음", p: `${TYPES[code[0]].name}과 ${TYPES[code[1]].name}은 육각형에서 이웃한 유형이라 관심사가 한 방향으로 잘 모여 있어요. 진로를 좁히기 좋은 상태예요.` },
      { v: "보통", p: `상위 두 유형이 한 칸 떨어져 있어요. 두 관심사를 함께 살릴 수 있는 직업을 찾으면 만족도가 높아요.` },
      { v: "낮음 (다양함)", p: `${TYPES[code[0]].name}과 ${TYPES[code[1]].name}은 육각형에서 정반대 유형이에요. 관심사가 폭넓다는 뜻이라, 직업 + 취미로 나눠 채우는 것도 방법이에요.` }
    ][dist];
    const diff = spread >= 40
      ? { v: "뚜렷함", p: "좋아하는 것과 아닌 것이 분명해요. 상위 유형 위주로 진로를 탐색해 보세요." }
      : spread >= 20
      ? { v: "보통", p: "선호가 어느 정도 드러나 있어요. 상위 2–3개 유형을 함께 보면 좋아요." }
      : { v: "고르게 분포", p: "여러 유형에 비슷하게 관심이 있어요. 직접 경험(체험, 인턴, 동아리)을 늘려 보면 선호가 더 분명해져요." };

    const combos = [];
    const lists = [TYPES[code[0]].jobs, TYPES[code[1]].jobs];
    for (let i = 0; combos.length < 8 && i < 8; i++) lists.forEach(l => { if (l[i] && combos.length < 8) combos.push(l[i]); });

    const scoreRows = ranked.map(k =>
      `<div class="score" style="--c:var(--${k})"><span class="name"><b>${k}</b>${TYPES[k].name}</span><span class="track"><i style="width:${sc[k]}%"></i></span><span class="num">${sc[k]}</span></div>`).join("");

    const topCards = code.map((k, i) => `
      <article class="top-type" style="--c:var(--${k})">
        <header><span class="letter">${k}</span><h3>${TYPES[k].name} <span class="meta">${TYPES[k].en}</span></h3><span class="rank">${i + 1}순위 · ${sc[k]}점</span></header>
        <p>${TYPES[k].desc}</p>
        <div class="kw">${TYPES[k].kw.map(w => `<span>${w}</span>`).join("")}</div>
        <div class="jobs">${TYPES[k].jobs.map(j => `<span>${j}</span>`).join("")}</div>
      </article>`).join("");

    const summary = `나의 홀랜드 흥미 코드: ${code.join("")} (${code.map(k => TYPES[k].name).join(" · ")})\n` +
      ORDER.map(k => `${k} ${TYPES[k].name} ${sc[k]}`).join(" / ") +
      `\n추천 직업: ${combos.join(", ")}`;

    $("result").innerHTML = `
      <div style="display:grid;gap:12px">
        <p class="eyebrow">검사 결과</p>
        <div class="code-line">
          <div class="code" style="--c1:var(--${code[0]});--c2:var(--${code[1]});--c3:var(--${code[2]})"><span>${code[0]}</span><span>${code[1]}</span><span>${code[2]}</span></div>
          <h1>${code.map(k => TYPES[k].name).join(" · ")}</h1>
        </div>
        <p class="lede">가장 강한 흥미는 <b>${TYPES[code[0]].name}</b>이에요 — ${TYPES[code[0]].tag}는 쪽에서 가장 큰 만족을 느낄 가능성이 높아요.</p>
      </div>

      <div class="chart-grid">
        ${hexSVG(sc)}
        <div class="scores">${scoreRows}<p class="meta">유형별 점수 (0–100)</p></div>
      </div>

      <div class="notes">
        <div class="note"><span class="k">일관도 · 상위 두 유형의 거리</span><span class="v">${consistency.v}</span><p>${consistency.p}</p></div>
        <div class="note"><span class="k">변별도 · 최고점과 최저점 차이 ${spread}점</span><span class="v">${diff.v}</span><p>${diff.p}</p></div>
      </div>

      <div class="combo">
        <h2>${code[0]}${code[1]} 조합에 어울리는 직업</h2>
        <div class="jobs">${combos.map(j => `<span>${j}</span>`).join("")}</div>
      </div>

      <div style="display:grid;gap:14px">
        <h2>상위 3개 유형 자세히 보기</h2>
        <div class="top-types">${topCards}</div>
      </div>

      <div class="row">
        <button class="btn primary" id="copyBtn" type="button">결과 복사하기</button>
        <button class="btn" id="retryBtn" type="button">다시 검사하기</button>
        <span class="toast" id="toast" role="status"></span>
      </div>
      <textarea id="copyText" readonly hidden style="width:100%;min-height:90px">${summary}</textarea>

      <p class="disclaimer">이 검사는 홀랜드(RIASEC) 이론을 바탕으로 만든 간이 흥미 검사예요. 공식 표준화 검사가 아니고 ‘능력’이 아닌 ‘흥미’를 보는 거라서, 진로를 정할 땐 참고 자료로 활용해 주세요. 더 정확한 결과가 필요하면 커리어넷·워크넷의 무료 직업 흥미 검사도 함께 해 보는 걸 추천해요.</p>
    `;
    show("result");

    $("retryBtn").addEventListener("click", () => {
      answers = new Array(QUESTIONS.length).fill(null); idx = 0; clearSave();
      show("quiz"); renderQ();
    });
    $("copyBtn").addEventListener("click", () => {
      const ok = () => $("toast").textContent = "결과를 복사했어요.";
      const fallback = () => { const t = $("copyText"); t.hidden = false; t.select(); $("toast").textContent = "아래 글을 직접 복사해 주세요."; };
      try { navigator.clipboard.writeText(summary).then(ok, fallback); } catch (e) { fallback(); }
    });
  }
})();
</script>
