        ["일정표대로 움직인다.", 1], ["일을 할 때 꼼꼼하고 엄격하다.", 1]],
    N: [["쉽게 스트레스를 받는다.", 1], ["대부분의 시간에 마음이 편안하다.", -1], ["이런저런 걱정을 많이 한다.", 1], ["우울한 기분이 드는 일은 드물다.", -1],
        ["작은 일에도 쉽게 동요한다.", 1], ["쉽게 속상해진다.", 1], ["기분이 자주 바뀐다.", 1], ["감정 기복이 심한 편이다.", 1],
        ["쉽게 짜증이 난다.", 1], ["자주 울적해진다.", 1]],
    O: [["어휘력이 풍부한 편이다.", 1], ["추상적인 개념을 이해하기 어렵다.", -1], ["상상력이 생생하다.", 1], ["추상적인 생각에는 관심이 없다.", -1],
        ["좋은 아이디어를 자주 떠올린다.", 1], ["상상력이 풍부한 편은 아니다.", -1], ["무언가를 빨리 이해한다.", 1], ["어려운 단어나 표현을 쓰는 편이다.", 1],
        ["이것저것 곰곰이 생각하는 데 시간을 쓴다.", 1], ["머릿속이 아이디어로 가득하다.", 1]]
  };
  // 한 요인이 몰리지 않도록 E A C N O 순서로 번갈아 배치
  const QUESTIONS = [];
  for (let i = 0; i < 10; i++) ["E", "A", "C", "N", "O"].forEach(f => QUESTIONS.push({ f, text: RAW[f][i][0], k: RAW[f][i][1] }));

  const SCALE = ["전혀 아니다", "아니다", "보통이다", "그렇다", "매우 그렇다"];
  const STORE_KEY = "bigfive-answers-v1";
  const $ = id => document.getElementById(id);
  let answers = new Array(QUESTIONS.length).fill(null);
  let idx = 0;

  function load() {
    try { const a = JSON.parse(localStorage.getItem(STORE_KEY)); if (Array.isArray(a) && a.length === QUESTIONS.length) return a; } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(answers)); } catch (e) {} }
  function clearSave() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

  $("factorLegend").innerHTML = ORDER.map(k =>
    `<div class="factor-chip" style="--c:var(--${k})"><b>${k}</b><span>${F[k].name}</span><small>${F[k].q}</small></div>`).join("");

  const saved = load();
  if (saved && saved.some(v => v !== null)) {
    const done = saved.filter(v => v !== null).length;
    $("resumeBtn").hidden = false;
    $("resumeBtn").textContent = done === QUESTIONS.length ? "지난 결과 보기" : `이어서 하기 (${done}/${QUESTIONS.length})`;
  }

  $("scale").innerHTML = SCALE.map((s, i) =>
    `<button type="button" data-v="${i}" aria-pressed="false"><b>${i + 1}</b>${s}</button>`).join("");
  $("scale").addEventListener("click", e => { const b = e.target.closest("button"); if (b) choose(+b.dataset.v); });

  function show(section) {
    ["intro", "quiz", "result"].forEach(s => $(s).hidden = s !== section);
    window.scrollTo({ top: 0 });
  }
  function renderQ() {
    const done = answers.filter(v => v !== null).length;
    $("qText").textContent = QUESTIONS[idx].text;
    $("progText").textContent = `${idx + 1} / ${QUESTIONS.length}`;
    $("progPct").textContent = Math.round(done / QUESTIONS.length * 100) + "%";
    $("progBar").style.width = (done / QUESTIONS.length * 100) + "%";
    $("scale").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === answers[idx])));
    $("prevBtn").disabled = idx === 0;
  }
  let locked = false;
  function choose(v) {
    if (locked) return;
    answers[idx] = v; save(); renderQ();
    locked = true;
    setTimeout(() => {
      locked = false;
      const next = answers.findIndex((a, i) => a === null && i > idx);
      const any = answers.indexOf(null);
      if (next !== -1) idx = next;
      else if (any !== -1) idx = any;
      else { showResult(); return; }
      renderQ();
    }, 180);
  }
  function restart() { answers = new Array(QUESTIONS.length).fill(null); idx = 0; clearSave(); show("quiz"); renderQ(); }

  $("startBtn").addEventListener("click", restart);
  $("resumeBtn").addEventListener("click", () => {
    answers = load() || answers;
    const any = answers.indexOf(null);
    if (any === -1) { showResult(); return; }
    idx = any; show("quiz"); renderQ();
  });
  $("prevBtn").addEventListener("click", () => { if (idx > 0) { idx--; renderQ(); } });
  document.addEventListener("keydown", e => {
    if ($("quiz").hidden) return;
    if (e.key >= "1" && e.key <= "5") choose(+e.key - 1);
    else if (e.key === "ArrowLeft" && idx > 0) { idx--; renderQ(); }
  });

  // 요인 점수: 역문항 뒤집어서 0~4로 합산(10문항 → 0~40), 0~100으로 환산
  function scores() {
    const s = Object.fromEntries(ORDER.map(k => [k, 0]));
    QUESTIONS.forEach((q, i) => { const v = answers[i] ?? 2; s[q.f] += q.k === 1 ? v : 4 - v; });
    return Object.fromEntries(ORDER.map(k => [k, Math.round(s[k] / 40 * 100)]));
  }
  const levelOf = v => v >= 65 ? "hi" : v <= 35 ? "lo" : "mid";
  const LEVEL_KO = { hi: "높음", mid: "중간", lo: "낮음" };

  function showResult() {
    const sc = scores();
    const lv = Object.fromEntries(ORDER.map(k => [k, levelOf(sc[k])]));

    const bars = ORDER.map(k => `
      <div class="trait" style="--c:var(--${k})">
        <span class="name"><b>${k}</b>${F[k].name}</span>
        <span class="track"><i style="width:${Math.max(sc[k], 2)}%"></i></span>
        <span class="num">${sc[k]}<small>${LEVEL_KO[lv[k]]}</small></span>
      </div>`).join("");

    const cards = ORDER.map(k => {
      const d = F[k][lv[k]];
      return `<article class="card" style="--c:var(--${k})">
        <header><span class="letter">${k}</span><h3>${F[k].name}</h3><span class="level">${LEVEL_KO[lv[k]]} · ${sc[k]}</span></header>
        <p><b>${d.t}</b><br>${d.d}</p>
        <div class="cols">
          <div><h4>이런 점이 강해요</h4><ul>${d.good.map(x => `<li>${x}</li>`).join("")}</ul></div>
          <div><h4>이런 점은 챙겨 주세요</h4><ul>${d.watch.map(x => `<li>${x}</li>`).join("")}</ul></div>
        </div>
      </article>`;
    }).join("");

    // 가장 두드러진 두 특성(중간값 50에서 가장 먼 것)으로 한 줄 요약
    const salient = [...ORDER].sort((a, b) => Math.abs(sc[b] - 50) - Math.abs(sc[a] - 50)).slice(0, 2);
    const headline = salient.map(k => `${F[k].name} ${LEVEL_KO[lv[k]]}`).join(" · ");

    const summary = `나의 Big Five 성격 5요인\n` + ORDER.map(k => `${k} ${F[k].name} ${sc[k]} (${LEVEL_KO[lv[k]]})`).join(" / ");

    $("result").innerHTML = `
      <div style="display:grid;gap:12px">
        <p class="eyebrow">검사 결과</p>
        <h1>가장 두드러진 특성: ${headline}</h1>
        <p class="lede">${F[salient[0]][lv[salient[0]]].t}. 그리고 ${F[salient[1]][lv[salient[1]]].t}. 성격 5요인은 좋고 나쁨이 아니라 ‘어느 쪽으로 기울어 있는가’를 보여 줘요.</p>
      </div>

      <div class="profile">
        <div class="scale-legend"><span></span><div><span>낮음</span><span>중간</span><span>높음</span></div><span></span></div>
        ${bars}
        <p class="meta">점수는 0–100 (35 이하 낮음 · 65 이상 높음). 다른 사람과 비교한 백분위가 아니라, 내 응답이 척도 안에서 어디쯤인지를 나타내요.</p>
      </div>

      <div style="display:grid;gap:14px">
        <h2>특성별로 자세히 보기</h2>
        <div class="cards">${cards}</div>
      </div>

      <div class="links">
        <h2>다른 검사 결과와 이어 보기</h2>
        <p class="meta">여러 검사에서 같은 방향이 반복되면 그게 ‘나’에 가까운 신호예요.</p>
        <div class="table-wrap"><table>
          <tr><th>Big Five</th><th>비슷한 방향의 다른 지표</th></tr>
          <tr><td>개방성 (O)</td><td>MBTI 직관(N) · 홀랜드 탐구형·예술형 · TCI 자극추구 일부</td></tr>
          <tr><td>성실성 (C)</td><td>MBTI 판단(J) · 홀랜드 관습형 · TCI 인내력·자율성</td></tr>
          <tr><td>외향성 (E)</td><td>MBTI 외향(E) · 홀랜드 진취형·사회형 · TCI 자극추구 일부</td></tr>
          <tr><td>우호성 (A)</td><td>MBTI 감정(F) · 홀랜드 사회형 · TCI 연대감·사회적 민감성</td></tr>
          <tr><td>신경성 (N)</td><td>MBTI에는 없음 · TCI 위험회피</td></tr>
        </table></div>
      </div>

      <div class="row">
        <button class="btn primary" id="copyBtn" type="button">결과 복사하기</button>
        <button class="btn" id="retryBtn" type="button">다시 검사하기</button>
        <span class="toast" id="toast" role="status"></span>
      </div>
      <textarea id="copyText" readonly hidden style="width:100%;min-height:90px">${summary}</textarea>

      <p class="disclaimer">문항은 공공 도메인 성격 문항 풀인 IPIP(International Personality Item Pool)의 Big-Five Factor Markers 50문항을 한국어로 옮겨 만들었어요. 한국인 표본으로 표준화된 검사가 아니라서 점수를 다른 사람과 비교하는 용도로는 맞지 않고, 나를 이해하는 참고 자료로 활용해 주세요.</p>
    `;
    show("result");

    $("retryBtn").addEventListener("click", restart);
    $("copyBtn").addEventListener("click", () => {
      const ok = () => $("toast").textContent = "결과를 복사했어요.";
      const fallback = () => { const t = $("copyText"); t.hidden = false; t.select(); $("toast").textContent = "아래 글을 직접 복사해 주세요."; };
      try { navigator.clipboard.writeText(summary).then(ok, fallback); } catch (e) { fallback(); }
    });
  }
})();
</script>
