# YouTube 채널 성과 모니터 설정 (소스 실행용 예시)
# 비밀값(API 키, 봇 토큰, chat_id)은 두 가지 방법 중 하나로 넣습니다.
#   1) .env 파일 (권장, git에 올라가지 않음) — .env.example 참고
#   2) 이 파일의 api_key / bot_token / chat_id 에 직접 (exe의 설정 창이 이렇게 저장)
#      → 이 방법을 쓰면 이 파일을 git에 커밋하거나 공유하지 마세요.
# 둘 다 있으면 환경변수(.env)가 우선합니다.

# 콘텐츠 언어/시장: en = 미국 중심 영어 쇼츠 (광고 단가가 높음), ko = 한국어
# 설정 창에서 바꾸면 아래 trends/video 의 지역·음성·자막 값이 한꺼번에 바뀝니다.
language: en
config_version: 2

youtube:
  api_key: ""
  api_key_env: YOUTUBE_API_KEY
  max_videos_per_channel: 30      # 채널별로 추적할 최근 영상 수 (50개당 약 1 unit)

# 채널 목록: id(UC로 시작) 또는 handle(@로 시작) 중 하나는 필수. name은 리포트 표시용(선택).
channels:
  - handle: "@YouTubeCreators"    # ← 내 채널로 바꾸세요
    name: "예시 채널"
  # - id: UCxxxxxxxxxxxxxxxxxxxxxx
  #   name: "두 번째 채널"
  #   analysis:                   # 채널별로 임계값 덮어쓰기 가능
  #     drop_threshold_pct: 40

analysis:
  # views_per_day : 누적 조회수 ÷ 게시 후 경과일 (첫 수집부터 바로 사용 가능)
  # views_at_age  : 게시 후 age_days일 시점 조회수 (영상 나이 편향 없음, 시계열이 쌓여야 함.
  #                 부족하면 자동으로 views_per_day 로 대체)
  metric: views_per_day
  age_days: 7
  min_age_days: 1                 # 게시 후 이 일수가 안 된 영상은 비교에서 제외
  recent_n: 5                     # 최근 N개 영상
  baseline_m: 10                  # 비교 기준: 그 이전 M개 영상
  min_baseline: 3                 # 이전 영상이 이보다 적으면 판단 보류
  aggregate: mean                 # mean(평균) | median(중앙값, 대박 영상 하나에 덜 흔들림)
  drop_threshold_pct: 30          # 최근 N개가 이전 M개 대비 X% 이상 하락하면 "성장 둔화"
  weekly_drop_threshold_pct: null # 채널 주간 조회수 증가량 하락률 기준 (예: 40). null이면 끔
  top_k: 3                        # 상위 성과 영상 개수
  alert_cooldown_hours: 24        # 같은 채널 재알림 최소 간격 (하락폭이 10%p 이상 커지면 즉시 재알림)
  shorts_max_seconds: 180         # 이 길이 이하를 숏폼으로 분류

telegram:
  enabled: true
  bot_token: ""
  chat_id: ""
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
  send_report_file: true          # 알림에 마크다운 리포트 파일 첨부
  notify_on_every_check: false    # true면 둔화가 없어도 매 점검마다 한 줄 요약 전송

ollama:                           # 로컬 LLM (https://ollama.com) — API 비용 없음
  enabled: true
  host: http://localhost:11434
  model: qwen2.5:7b               # 먼저: ollama pull qwen2.5:7b
  auto_generate_on_slowdown: true # 둔화 감지 시 주제/제목/대본 자동 생성
  num_topics: 5                   # 주제 후보 수 (3~5)
  num_titles: 3                   # 주제별 제목 후보 수 (2~3)
  script_minutes: 3               # 대본 목표 길이(분)
  upload_meta: true               # 대본과 함께 업로드 정보(클릭 잘 되는 제목 5개 · 카테고리 · 설명 · 해시태그) 생성
  temperature: 0.7
  num_ctx: 8192
  timeout_sec: 900                # CPU만 있는 PC는 대본 생성에 수 분 걸릴 수 있음

trends:                           # 🔥 최근 유행 쇼츠 분석 → 주제/쇼츠 대본 → 영상
  region: US                      # 유행을 볼 나라 (US, GB, CA, AU, KR …)
  language: en
  lookback_days: 3                # 최근 며칠 안에 올라온 쇼츠만
  shorts_max_seconds: 180         # 쇼츠 최대 길이(초)
  search_queries: ["", "#shorts"] # 조회수순 검색어 ("" = 검색어 없이 전체). 검색 1번 = 쿼터 100
  popular_pages: 4                # 인기 급상승 목록 페이지 수 (50개씩, 페이지당 쿼터 1)
  title_language: en              # en = 영어 제목만, ko = 한글 제목만, any = 전부
  top_n: 30                       # Ollama에 넘길 상위 영상 수
  breakout_ratio: 3               # 조회수가 구독자의 N배 이상이면 '떡상' 표시
  min_views: 50000
  script_seconds: 50              # 쇼츠 대본 목표 길이(초)
  auto_video: false               # true면 대본 생성 후 영상까지 자동으로 만듦 (GUI 체크박스와 같음)

pexels:                           # 무료 스톡 영상 API — https://www.pexels.com/api/ 가입하면 즉시 발급
  api_key: ""
  api_key_env: PEXELS_API_KEY     # .env 에 PEXELS_API_KEY=... 로 넣어도 됨
  orientation: portrait           # 쇼츠용 세로 영상 우선 (landscape | portrait | square)
  per_page: 15                    # 키워드당 검색 결과 수
  timeout_sec: 60

pixabay:                          # (선택) 스톡 영상 추가 소스 — https://pixabay.com/api/docs/ 가입하면 키 표시
  api_key: ""
  api_key_env: PIXABAY_API_KEY
  per_page: 15

ai_images:                        # (선택) 로컬 AI 이미지 생성 — ComfyUI (https://www.comfy.org/download)
  enabled: false
  host: http://127.0.0.1:8188
  comfy_dir: ""                   # ComfyUI portable 폴더 (run_nvidia_gpu.bat 있는 곳). 비우면 자동으로 찾음
  auto_start: true                # 영상 만들 때 ComfyUI가 꺼져 있으면 창 없이 자동으로 켜기
  auto_stop: true                 # 자동으로 켠 ComfyUI는 AI 이미지를 다 만들면 끄기 (그래픽카드 메모리 반환)
  start_timeout_sec: 240
  auto_tune: true                 # sdxl_lightning 모델이면 steps·cfg·sampler를 이름에 맞게 자동 설정 (아래 4개 무시)
  mode: mix                       # mix = 첫 씬(훅) + 스톡 영상 없는 씬 / all = 모든 씬
  checkpoint: ""                  # 비우면 ComfyUI models/checkpoints 의 첫 번째 모델
  width: 768
  height: 1344                    # 9:16에 가까운 SDXL 해상도
  steps: 6                        # Lightning/Turbo 모델 기준. 일반 SDXL은 25~30
  cfg: 2.0                        # Lightning 기준. 일반 SDXL은 5~7
  sampler: dpmpp_sde
  scheduler: karras
  style: RAW photo, candid photograph, shot on 35mm, natural lighting, realistic skin texture, subtle film grain, sharp focus   # 실제 사진처럼
  negative: cgi, 3d render, illustration, painting, drawing, cartoon, anime, plastic skin, airbrushed, overly smooth skin, oversaturated, text, watermark, logo, blurry, low quality, deformed hands, extra fingers, ugly, nsfw
  timeout_sec: 300

video:                            # 대본 → 쇼츠 영상 자동 생성 (edge-tts + Pexels + ffmpeg)
  ffmpeg_path: ""                 # 비우면 exe 옆 ffmpeg.exe → PATH 순서로 찾음
  width: 1080
  height: 1920                    # 9:16 세로
  fps: 30
  clip_max_seconds: 2.5           # 씬당 클립 길이. 씬이 이보다 길면 클립 여러 개로 나눠 붙임 (쇼츠는 빠른 컷)
  zoom: 0.08                      # 컷마다 천천히 8% 줌인/줌아웃 (0이면 끔)
  contrast: 1.08                  # 대비 (1 = 원본)
  saturation: 1.2                 # 채도 (1 = 원본). 스톡 영상 특유의 밋밋함을 줄임
  hook_seconds: 2.5               # 첫 화면 큰 훅 문구 표시 시간 (0이면 끔)
  hook_font_size: 96
  min_scene_seconds: 2.5          # 이보다 짧은 문장은 다음 문장과 합쳐 한 씬으로
  max_scene_chars: 160            # 씬 하나에 넣을 최대 글자 수
  keywords_per_scene: 3           # Ollama가 뽑을 씬별 검색 키워드 수 (앞에서부터 검색)
  voice_mode: auto                # auto = 대본 분위기(신남/긴장/미스터리/차분/유쾌/감성)에 맞춰 음성 자동 선택
                                  # fixed = 아래 tts_voice 고정. 영상 생성 탭에서 음성을 고르면 그 음성 사용
  mood_voices: {}                 # 분위기별 음성 바꾸기 (선택). 예: {en: {calm: {voice: en-US-JennyNeural, rate: "+0%"}}}
  tts_voice: en-US-GuyNeural      # 남성. 여성: en-US-JennyNeural, en-US-AriaNeural / 한국어: ko-KR-SunHiNeural
  tts_rate: "+5%"                 # 말하기 속도
  tts_volume: "+0%"
  tts_pitch: "+0Hz"
  tts_proxy: ""                   # 회사망 등에서 필요할 때만 (예: http://proxy:8080)
  subtitle_font: Arial Black      # 영어 쇼츠용 굵은 폰트 (한국어는 Malgun Gothic)
  subtitle_font_size: 76          # 1080x1920 기준 픽셀
  subtitle_max_chars: 18          # 자막 한 덩어리 최대 글자 수
  subtitle_margin_bottom: 320     # 화면 아래에서 자막까지 거리(px). 쇼츠 버튼/설명에 안 가리게
  subtitle_box_opacity: 0.6       # 자막 뒤 검은 박스 불투명도 (0~1)
  crf: 21                         # 화질 (낮을수록 고화질·큰 파일, 18~28)
  preset: veryfast                # 인코딩 속도 (ultrafast ~ slow)
  keep_work_files: true           # 중간 파일(클립, 음성, ffmpeg 로그)을 <이름>_work/ 에 보관
  upload_meta: true               # 영상 옆에 <이름>_업로드정보.txt (제목 후보 · 카테고리 · 설명 · 해시태그 · 출처)
  bgm_enabled: true               # bgm/<분위기>/ 폴더에 넣은 곡을 분위기에 맞게 골라 깔기 (폴더가 비면 목소리만)
  bgm_volume: 0.15                # 배경음악 크기 (0.1 작게 ~ 0.3 크게)
  bgm_duck: true                  # 목소리가 나올 때 음악 자동으로 줄이기

storage:
  db_path: data/yt_monitor.db     # 이 파일 기준 상대 경로
  reports_dir: reports            # 수집할 때마다 저장하는 채널 리포트
  outputs_dir: outputs            # 생성한 주제/대본/영상 (outputs/날짜/채널명.md, 제목.mp4)
  prompts_dir: prompts            # 프롬프트 템플릿 (topics.txt, script_gen.txt, video_scenes.txt)
  video_cache_dir: data/video_cache  # 다운로드한 스톡 영상 캐시 (지워도 됨)
  bgm_dir: bgm                    # 배경음악 폴더: bgm/energetic, dramatic, mysterious, calm, playful, emotional

schedule:
  interval_hours: null            # 숫자를 넣으면 N시간 간격 (설정 창의 '체크 주기')
  cron: "0 */6 * * *"             # interval_hours가 없을 때 사용. 기본: 6시간마다 정각
  timezone: Asia/Seoul
  run_on_start: true              # --schedule 시작 직후 1회 실행

# report:
#   claude_request: |             # Claude에 붙여넣을 프롬프트의 "요청" 부분 (생략하면 기본 문구)
#     1. 다음 영상 주제 5개 추천해줘.
#     2. 가장 유망한 주제로 8분 분량 대본 써줘.
